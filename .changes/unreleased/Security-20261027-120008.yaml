kind: Security
body: "Patched transitive dev-toolchain advisories via pinned pnpm overrides: `brace-expansion`, `proxy-addr`, `smol-toml`, `source-map-js`, and `sharp` (the librsvg advisory fixed in 0.35.5), in both the root and `deploy/customer-hosted` lockfiles. `braces` and `node-forge` have no patched release on npm yet, so they carry time-boxed `audit-policy.json` exceptions (dev-only, expiring 2026-11-05). (#481)"
