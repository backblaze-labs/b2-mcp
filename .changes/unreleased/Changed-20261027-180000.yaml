kind: Changed
body: "`CHANGELOG.md` is now generated by changie from `.changes/`, matching the other Backblaze open-source SDKs; contributors add a fragment with `pnpm run changelog:new`, and the `changelog` PR check requires one for user-visible changes. The repository also adopts the AI-native SDLC playbook (`intent/`, `REVIEW.md`, `pnpm run ci`, agent evals, control bands). No runtime or package change. (#528)"
