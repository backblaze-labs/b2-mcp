# zizmor (GitHub Actions static analysis) configuration.
#
# This is the single, checked-in source of truth for zizmor suppressions.
# Every entry MUST carry a rationale so an auditor can see why a finding is
# accepted rather than fixed. Inline `# zizmor: ignore[...]` comments have been
# migrated here so suppressions live in one reviewable place.
#
# Docs: https://docs.zizmor.sh/configuration/
rules:
  ref-version-mismatch:
    ignore:
      # Repo-wide convention. Every action is SHA-pinned and annotated with a
      # human-reviewed comment on the PRECEDING line
      # (`# <action> vX.Y.Z, reviewed <date>`), which is stricter than the
      # inline `# vX.Y.Z` tag this audit looks for. ref-version-mismatch only
      # recognizes an inline same-line comment, so it reports the entire pinned
      # surface (200+ uses) as false positives against that convention. The pin
      # digests and their reviewed dates are the source of truth; adding a
      # second inline version tag would duplicate that metadata and invite the
      # drift this convention avoids. Accepted for every workflow (zizmor has no
      # glob support, so each file is listed explicitly).
      - codeql.yml
      - contract.yml
      - docs.yml
      - evals.yml
      - mutation.yml
      - publish.yml
      - quality-keeper.yml
      - release-tag.yml
      - smoke.yml
      - test.yml
  dangerous-triggers:
    ignore:
      # Publish Package runs on `workflow_run` from the unprivileged "Release
      # Tag Request" workflow. It only consumes an inert tag artifact, checks
      # out trusted `ci-green` resolver code, validates protected refs, and
      # publishes behind protected environments — it never runs
      # attacker-controllable head code. The privileged-trigger risk this audit
      # flags is mitigated by that design, so the finding is accepted.
      #
      # Anchored to publish.yml's `on:` key (publish.yml:9). zizmor 1.29.0
      # anchors EVERY dangerous-triggers finding to this same `on:` key, so this
      # line-scoped ignore would also cover another dangerous trigger (e.g.
      # pull_request_target) added to the same block. That over-breadth is
      # deliberately compensated by a required test
      # (tests/unit/supply-chain-policy.unit.test.ts) that fails if publish.yml's
      # `on:` gains pull_request_target/pull_request or any trigger other than the
      # reviewed workflow_run — so a newly added dangerous trigger can never be
      # silently suppressed by this entry. Re-review whenever publish.yml's
      # triggers change.
      - publish.yml:9
  adhoc-packages:
    ignore:
      # The packed-install smoke test (test.yml:406) is the pack-smoke install
      # of the locally-built tarball, not an unpinned third-party dependency.
      # It builds the package tarball, then `npm install`s THAT tarball into an
      # isolated temp dir to prove the published artifact installs cleanly —
      # validating the real `npm install` experience a consumer gets. Installing
      # the artifact under test outside a lockfile is the entire point of the
      # check, and it is already hardened (`--ignore-scripts`, `--omit=dev`) and
      # installs only the locally-built `$tarball_path`. The adhoc-packages
      # risk this audit flags does not apply, so the finding is accepted.
      #
      # Anchored to the `npm install "$tarball_path"` line (test.yml:406).
      # Re-review whenever the pack-smoke install step moves or changes what it
      # installs.
      - test.yml:406
  artipacked:
    ignore:
      # The ci-green marker job (test.yml:1021) checks out with
      # `persist-credentials: true` on purpose: it force-advances the owned
      # `ci-green` marker ref on `main` via `git push` in the following step,
      # and that push needs the persisted checkout credential. Setting
      # `persist-credentials: false` would break the marker push — it is a
      # functional requirement here, not an oversight.
      #
      # `persist-credentials: true` leaves the `contents: write` GITHUB_TOKEN
      # usable by Git for the job's full duration: actions/checkout v7 stores
      # the credential in a Git config file under `$RUNNER_TEMP` and wires it
      # into the checkout's local `.git/config` via an `http.<host>.extraheader`
      # and an `includeIf.gitdir` include, so any Git command in the job can use
      # it — not only an artifact-upload step. The true safety
      # invariant is therefore that this job runs NO untrusted/third-party code
      # while the credential is persisted: it runs only the SHA-pinned
      # `actions/checkout` and inline, trusted git commands, uploads no
      # artifacts, and is `main`-only. Under that invariant the persisted
      # credential has no exfil surface, so the artipacked finding is accepted.
      # Re-review whenever this job gains any third-party action/script, an
      # artifact upload, or stops pushing the marker ref.
      #
      # Anchored to the ci-green marker `actions/checkout` (test.yml:1021).
      # zizmor matches ignores by file:line, not by job/step identity, so a
      # shifted line could mask an unrelated checkout. A required test
      # (tests/unit/supply-chain-policy.unit.test.ts) compensates: it fails if
      # this anchor no longer resolves to the persist-credentials:true checkout
      # inside the mark-green job, or if any other job persists credentials.
      - test.yml:1021
