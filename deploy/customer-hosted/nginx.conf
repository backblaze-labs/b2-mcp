upstream b2_mcp_backend {
    zone b2_mcp_backend 64k;
    least_conn;
    server b2-mcp-a:3000 resolve max_fails=2 fail_timeout=10s;
    server b2-mcp-b:3000 resolve max_fails=2 fail_timeout=10s;
    keepalive 32;
}

resolver 127.0.0.11 ipv6=off valid=10s;

limit_req_zone $binary_remote_addr zone=b2_mcp_requests:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=b2_mcp_connections:10m;

map $http_origin $origin_allowed {
    default 0;
    "" 1;
    "https://client.example.com" 1;
}

log_format mcp_safe '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

server {
    listen 443 ssl http2;
    server_name mcp.example.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # For mTLS/workload identity, provide your workload CA and enforce
    # $ssl_client_verify = SUCCESS in /mcp before proxying.
    # ssl_client_certificate /etc/nginx/workload-ca.pem;
    # ssl_verify_client optional;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    access_log /var/log/nginx/access.log mcp_safe;

    location = /.well-known/oauth-protected-resource {
        default_type application/json;
        return 200 '{"resource":"https://mcp.example.com/mcp","authorization_servers":["https://auth.example.com"],"scopes_supported":["b2:mcp"],"bearer_methods_supported":["header"]}';
    }

    location = /.well-known/oauth-protected-resource/mcp {
        default_type application/json;
        return 200 '{"resource":"https://mcp.example.com/mcp","authorization_servers":["https://auth.example.com"],"scopes_supported":["b2:mcp"],"bearer_methods_supported":["header"]}';
    }

    location = /_oauth2/validate {
        internal;
        set $oauth_validator http://oauth-validator:8080/validate;
        proxy_pass $oauth_validator;
        proxy_connect_timeout 2s;
        proxy_send_timeout 2s;
        proxy_read_timeout 3s;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-MCP-Resource https://mcp.example.com/mcp;
        proxy_set_header X-MCP-Required-Scope b2:mcp;
        proxy_set_header X-Original-URI $request_uri;
    }

    location @oauth_challenge {
        add_header WWW-Authenticate 'Bearer resource_metadata="https://mcp.example.com/.well-known/oauth-protected-resource/mcp", scope="b2:mcp"' always;
        return 401;
    }

    location @scope_challenge {
        add_header WWW-Authenticate 'Bearer resource_metadata="https://mcp.example.com/.well-known/oauth-protected-resource/mcp", error="insufficient_scope", scope="b2:mcp"' always;
        return 403;
    }

    location = /mcp {
        if ($host != "mcp.example.com") { return 421; }
        if ($origin_allowed = 0) { return 403; }

        limit_req zone=b2_mcp_requests burst=30 nodelay;
        limit_conn b2_mcp_connections 40;
        client_max_body_size 1m;

        auth_request /_oauth2/validate;
        auth_request_set $auth_subject $upstream_http_x_mcp_subject;
        auth_request_set $auth_issuer $upstream_http_x_mcp_issuer;
        auth_request_set $auth_scopes $upstream_http_x_mcp_scopes;
        error_page 401 = @oauth_challenge;
        error_page 403 = @scope_challenge;
        error_page 500 502 503 504 = @oauth_unavailable;

        proxy_pass http://b2_mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Drop inbound credentials and caller-controlled identity headers by
        # rebuilding the upstream header set explicitly.
        proxy_pass_request_headers off;
        proxy_set_header Host $host;
        # This reference proxy is the public edge, so overwrite any
        # caller-supplied X-Forwarded-For value with the verified socket peer.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Origin $http_origin;
        proxy_set_header Accept $http_accept;
        proxy_set_header Content-Type $content_type;

        # Preserve MCP routing/metering hints. The MCP server and SDK still
        # validate the JSON body and header/body equality before execution.
        proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
        proxy_set_header Mcp-Method $http_mcp_method;
        proxy_set_header Mcp-Name $http_mcp_name;
        proxy_set_header Mcp-Param-Bucket $http_mcp_param_bucket;
        proxy_set_header Mcp-Param-Prefix $http_mcp_param_prefix;
        proxy_set_header Mcp-Param-Tool $http_mcp_param_tool;

        # Trusted identity headers are added only after OAuth or mTLS
        # validation. The stock server-mode container ignores these; a
        # principal-mode wrapper may translate them to SDK authInfo.
        proxy_set_header X-MCP-Verified-Subject $auth_subject;
        proxy_set_header X-MCP-Verified-Issuer $auth_issuer;
        proxy_set_header X-MCP-Verified-Scopes $auth_scopes;
    }

    location @oauth_unavailable {
        return 503;
    }

    # Health and readiness are intentionally internal-only. Container and host
    # checks use the private Docker network; public clients get no version or
    # in-flight counters.
    location = /health { return 404; }
    location = /ready { return 404; }

    location / { return 404; }
}

server {
    listen 80;
    server_name mcp.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / { return 444; }
}
