allowBuilds:
  '@modelcontextprotocol/inspector': false
  # tsx depends on esbuild, whose platform packages ship native binaries.
  # Keep install scripts disabled; esbuild only runs when dev tooling invokes it.
  esbuild: false
  # wrangler depends on workerd's platform packages. Keep install scripts disabled;
  # the Worker smoke uses the downloaded optional binary package directly.
  workerd: false
minimumReleaseAgeExclude:
  - '@vercel/cervel@0.1.47'
  - '@vercel/elysia@0.1.116'
  - '@vercel/express@0.1.130'
  - '@vercel/fastify@0.1.119'
  - '@vercel/h3@0.1.125'
  - '@vercel/hono@0.2.119'
  - '@vercel/koa@0.1.99'
  - '@vercel/nestjs@0.2.120'
  - '@vercel/next@4.21.7'
  - '@vercel/node@5.10.2'
  - '@vercel/python@6.58.0'
  - '@vercel/redwood@2.5.2'
  - '@vercel/remix-builder@5.9.5'
  - '@vercel/static-build@2.12.8'
  - '@vercel/vc-native-darwin-arm64@59.3.0'
  - '@vercel/vc-native-darwin-x64@59.3.0'
  - '@vercel/vc-native-linux-arm64@59.3.0'
  - '@vercel/vc-native-linux-x64@59.3.0'
  - vercel@59.3.0
overrides:
  # Force the dev-only mcpb packer's interactive-editor path off vulnerable
  # tmp 0.0.33 (GHSA path-traversal); mcpb pack never prompts, but the audit
  # scans dev deps. external-editor is tmp's only consumer.
  'external-editor>tmp': ^0.2.7
  '@istanbuljs/load-nyc-config>js-yaml': 3.15.1
  '@typescript-eslint/visitor-keys>eslint-visitor-keys': 4.2.1
  '@hono/node-server': 2.0.10
  '@types/node': 22.20.4
  '@vercel/backends>path-to-regexp': 8.4.0
  # Dev-only transitive dep via @vercel/blob; force the patched build off the
  # undici WebSocket permessage-deflate DoS (GHSA-3wwx-pv8p-q78v, fixed 6.28.1).
  '@vercel/blob>undici': '>=6.28.1 <7'
  '@vercel/express>path-to-regexp': 8.4.0
  '@vercel/fun>path-to-regexp': 8.4.0
  '@vercel/fun>tar': 7.5.21
  # Force every node-tar consumer (e.g. @vercel/container pulls a vulnerable 7.x)
  # onto the patched line off the PAX/recursion DoS advisories (fixed 7.5.21).
  tar: '>=7.5.21'
  '@vercel/fun>@tootallnate/once': 2.0.1
  '@vercel/hono>path-to-regexp': 8.4.0
  '@vercel/node>path-to-regexp': 6.3.0
  '@vercel/node>undici': '>=6.28.1 <7'
  '@vercel/python-analysis>js-yaml': 4.3.2
  '@vercel/python-analysis>minimatch': 10.2.3
  '@vercel/python-analysis>smol-toml': '>=1.8.1 <2'
  '@vercel/remix-builder>path-to-regexp': 6.3.0
  '@vercel/rust>smol-toml': '>=1.8.1 <2'
  '@vercel/static-config>ajv': 8.18.0
  esbuild: 0.28.1
  vercel>path-to-regexp: 8.4.0
  vercel>smol-toml: '>=1.8.1 <2'
  vercel>undici: '>=6.28.1 <7'
  'minimatch@3.1.5>brace-expansion': 1.1.21
  nanoid: 3.3.18
  # Dev-only transitive deps (via ajv/vercel); force patched builds off the
  # fast-uri host-confusion/SSRF advisories (incl. GHSA-58mr-gqgx-xq4g, fixed in
  # 3.1.7) and the qs array-limit/DoS advisories.
  fast-uri: '>=3.1.7 <4'
  qs: '>=6.16.0'
  # Dev-only transitive dep; force the patched build off GHSA-2vr4-cq9g-pvrc
  # (ip-address ReDoS/parse advisory affecting >=10.2.0 <=10.5.0, fixed 10.5.1).
  ip-address: '>=10.5.1 <11'
  # Dev-only transitive dep via miniflare/wrangler; force the patched build off
  # the libheif advisories bundled in sharp <0.35.4 (GHSA-g89c-p67h-r497,
  # GHSA-2jg2-4ch7-h545) and the librsvg advisory fixed in 0.35.5
  # (GHSA-wq5f-xc86-pv6w). The Worker smoke never invokes sharp's image codecs.
  'miniflare>sharp': '>=0.35.5'
  # Dev-only transitive deps via vercel build tooling and wrangler/miniflare. The
  # undici WebSocket permessage-deflate DoS (GHSA-3wwx-pv8p-q78v) also affects the
  # 7.x (<7.29.1) and 8.x (<8.10.2) lines; a stray vulnerable smol-toml 1.5.2
  # (<1.7.1) arrives via @vercel/container. Each major-selector is upper-bounded
  # so consumers stay on their own reviewed major (miniflare and @vercel/sandbox
  # are undici-7 consumers) — patched, without an unreviewed cross-major upgrade.
  'undici@7': '>=7.29.1 <8'
  'undici@8': '>=8.10.2 <9'
  'smol-toml@1': '>=1.8.1 <2'
  # Dev-only transitive dep via typedoc; force the patched build off the
  # markdown-it linkify quadratic-time DoS (GHSA-253c-mchw-3w2r, fixed 14.3.1).
  markdown-it: '>=14.3.1 <15'
  # Dev-only transitive deps; force patched builds off the brace-expansion
  # recursion/quadratic-time DoS advisories (GHSA-q2hr-2g5m-vwhr,
  # GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p; fixed 5.0.12 / 1.1.21), the
  # proxy-addr IPv4-mapped IPv6 trust-subnet spoofing advisory
  # (GHSA-jqcg-44mw-7w3h, fixed 2.0.8, via the inspector's express), the
  # smol-toml parseKey quadratic-time advisory (GHSA-r4xh-jqrq-34v2, fixed
  # 1.8.1), and the source-map-js indexed-section DoS (GHSA-68fv-2mgg-jv7q,
  # fixed 1.2.2). Each is bounded to its current major.
  'brace-expansion@5': '>=5.0.12 <6'
  proxy-addr: '>=2.0.8 <3'
  source-map-js: '>=1.2.2 <2'
