name: b2-mcp-reference

x-b2-mcp-service: &b2-mcp-service
  build:
    context: .
    dockerfile: Dockerfile
    args:
      B2_MCP_VERSION: ${B2_MCP_VERSION:-0.1.0}
  image: b2-mcp-reference:${B2_MCP_VERSION:-0.1.0}
  env_file:
    - ./b2-mcp.env
  expose:
    - "3000"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  mem_limit: 1g
  stop_grace_period: 15s
  restart: unless-stopped
  secrets:
    - b2_application_key_id
    - b2_application_key
  networks:
    - b2-mcp-private

services:
  b2-mcp-a:
    <<: *b2-mcp-service

  b2-mcp-b:
    <<: *b2-mcp-service

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      b2-mcp-a:
        condition: service_healthy
      b2-mcp-b:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=64m
      - /var/run:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/letsencrypt:/var/www/letsencrypt:ro
    networks:
      - b2-mcp-private
    restart: unless-stopped

secrets:
  b2_application_key_id:
    file: ./secrets/b2_application_key_id
  b2_application_key:
    file: ./secrets/b2_application_key

networks:
  b2-mcp-private:
    driver: bridge
