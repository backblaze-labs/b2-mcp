name: Live B2 Smoke

# End-to-end smoke against a deployed MCP endpoint using the protected live B2
# smoke environment. The smoke bucket must be a dedicated test-owned bucket.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "47 9 * * 1"

permissions:
  contents: read

concurrency:
  group: live-b2-smoke-${{ github.repository }}
  cancel-in-progress: false

jobs:
  guard:
    if: github.repository == 'backblaze-labs/b2-mcp'
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.ref.outputs.should_run }}
      checkout-sha: ${{ steps.ref.outputs.checkout_sha }}
    steps:
      - name: Resolve trusted live-smoke ref
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          should_run=true
          checkout_sha="${GITHUB_SHA}"

          case "${EVENT_NAME}" in
            workflow_dispatch)
              if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
                echo "::error::workflow_dispatch must run from main; got ${GITHUB_REF}"
                exit 1
              fi
              ;;
            push|schedule)
              if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
                echo "::error::${EVENT_NAME} live smoke runs must target main; got ${GITHUB_REF}"
                exit 1
              fi
              ;;
            pull_request)
              if [[ "${PR_HEAD_REPO}" != "${GITHUB_REPOSITORY}" ]]; then
                echo "::notice::Skipping fork pull request because protected B2 secrets are unavailable."
                should_run=false
                checkout_sha=""
              else
                checkout_sha="${PR_HEAD_SHA}"
              fi
              ;;
            *)
              echo "::error::unsupported live-smoke event: ${EVENT_NAME}"
              exit 1
              ;;
          esac

          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"
          echo "checkout_sha=${checkout_sha}" >> "$GITHUB_OUTPUT"

  smoke:
    name: live B2 smoke / Node ${{ matrix.node-version }}
    needs: guard
    if: needs.guard.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    environment: live-b2-smoke
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        node-version: [22.3.0, 24, 26]
    steps:
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.guard.outputs.checkout-sha }}
          persist-credentials: false
      # pnpm/action-setup v6.0.10, reviewed 2026-08-06.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Validate live B2 smoke environment
        env:
          MCP_URL: ${{ vars.MCP_URL }}
          B2_KEY_ID: ${{ secrets.LIVE_B2_KEY_ID }}
          B2_KEY: ${{ secrets.LIVE_B2_KEY }}
          B2_APP_KEY_ID: ${{ secrets.LIVE_B2_APP_KEY_ID }}
          B2_APP_KEY: ${{ secrets.LIVE_B2_APP_KEY }}
          B2_SMOKE_BUCKET: ${{ vars.B2_SMOKE_BUCKET }}
          B2_MCP_EXPECTED_TOOL_PROFILE: ${{ vars.B2_MCP_EXPECTED_TOOL_PROFILE }}
          B2_MCP_REQUIRE_SMOKE_BUCKET: "1"
        run: |
          set -euo pipefail
          for value in "${B2_SMOKE_BUCKET:-}"; do
            if [[ -n "$value" ]]; then echo "::add-mask::$value"; fi
          done
          missing=0
          for name in MCP_URL B2_KEY_ID B2_KEY B2_APP_KEY_ID B2_APP_KEY B2_SMOKE_BUCKET B2_MCP_EXPECTED_TOOL_PROFILE B2_MCP_REQUIRE_SMOKE_BUCKET; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required live-b2-smoke variable or secret for ${name}"
              missing=1
            fi
          done
          exit "$missing"
      - name: Run live B2 smoke
        env:
          MCP_URL: ${{ vars.MCP_URL }}
          B2_KEY_ID: ${{ secrets.LIVE_B2_KEY_ID }}
          B2_KEY: ${{ secrets.LIVE_B2_KEY }}
          B2_APP_KEY_ID: ${{ secrets.LIVE_B2_APP_KEY_ID }}
          B2_APP_KEY: ${{ secrets.LIVE_B2_APP_KEY }}
          B2_SMOKE_BUCKET: ${{ vars.B2_SMOKE_BUCKET }}
          B2_MCP_EXPECTED_TOOL_PROFILE: ${{ vars.B2_MCP_EXPECTED_TOOL_PROFILE }}
          B2_MCP_REQUIRE_SMOKE_BUCKET: "1"
        run: pnpm run smoke
