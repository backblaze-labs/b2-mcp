name: Changie integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changie:
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7, reviewed 2026-11-18.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actions/setup-node v7, reviewed 2026-11-18.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.1
      # actions/setup-go v6, reviewed 2026-11-18.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.0'
          cache: false
      - name: Install pinned Changie
        env:
          GOBIN: ${{ runner.temp }}/changie-bin
        run: |
          go install github.com/miniscruff/changie@v1.26.0
          echo "$GOBIN" >> "$GITHUB_PATH"
      - run: node --test tests/release/changie.integration.test.mjs
