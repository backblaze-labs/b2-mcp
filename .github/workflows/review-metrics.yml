name: Review Metrics

# Weekly human-time-per-change and review-round metrics (ops/review-metrics/).
# Read-only; writes only the job summary.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

permissions: {}

concurrency:
  group: review-metrics-${{ github.repository }}
  cancel-in-progress: false

jobs:
  metrics:
    if: github.repository == 'backblaze-labs/b2-mcp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Checks out the metrics script.
      pull-requests: read # Reads merged PRs and their reviews.
    steps:
      # actions/checkout v7, reviewed 2026-08-25.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - name: Summarize the last 30 days
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAYS: "30"
        run: node ops/review-metrics/metrics.mjs >> "$GITHUB_STEP_SUMMARY"
