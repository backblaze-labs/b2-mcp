name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - run: npm run check:runtime-policy

  runtime-engine-floor:
    name: packed runtime consumer / Node 22.3.0
    needs: runtime-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.3.0
      - name: Run Node 22.3.0 runtime compatibility smoke
        run: node scripts/packed-consumer-smoke.mjs

  package-budget:
    name: package budget
    needs: runtime-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run build
      - run: npm run check:package-budget
      - name: Upload package budget reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: package-budget
          path: reports/package-budget/
          if-no-files-found: error

  deterministic-linux-production:
    name: deterministic linux production / Node ${{ matrix.node-version }}
    needs: runtime-policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.23.1]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run format:check
      - run: npm run lint
      - run: npm run spell
      - run: npm run lint:docs
      - run: npm run build
      - id: typecheck
        continue-on-error: true
        run: npm run typecheck
      - id: coverage
        continue-on-error: true
        run: npm run test:coverage
      - id: slow
        continue-on-error: true
        run: npm run test:slow
      - id: package-smoke
        continue-on-error: true
        run: npm run smoke:package
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: test-reports-node-${{ matrix.node-version }}
          path: |
            reports/junit/*.xml
            reports/jest/*.json
            coverage/coverage-summary.json
            coverage/cobertura-coverage.xml
          if-no-files-found: error
      - name: Fail on test errors
        if: >-
          steps.typecheck.outcome == 'failure' ||
          steps.coverage.outcome == 'failure' ||
          steps.slow.outcome == 'failure' ||
          steps.package-smoke.outcome == 'failure'
        run: exit 1

  deterministic-linux-current:
    name: deterministic linux current / Node ${{ matrix.node-version }}
    needs: runtime-policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run format:check
      - run: npm run lint
      - run: npm run spell
      - run: npm run lint:docs
      - run: npm run build
      - id: typecheck
        continue-on-error: true
        run: npm run typecheck
      - id: coverage
        continue-on-error: true
        run: npm run test:coverage
      - id: slow
        continue-on-error: true
        run: npm run test:slow
      - id: package-smoke
        continue-on-error: true
        run: npm run smoke:package
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: test-reports-node-${{ matrix.node-version }}
          path: |
            reports/junit/*.xml
            reports/jest/*.json
            coverage/coverage-summary.json
            coverage/cobertura-coverage.xml
          if-no-files-found: error
      - name: Fail on test errors
        if: >-
          steps.typecheck.outcome == 'failure' ||
          steps.coverage.outcome == 'failure' ||
          steps.slow.outcome == 'failure' ||
          steps.package-smoke.outcome == 'failure'
        run: exit 1

  cross-platform-minimum:
    name: cross-platform minimum / ${{ matrix.os }}
    needs: runtime-policy
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run build
      - run: npm run test:cross-platform

  package:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run test:package
      - name: Upload package test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: package-test-reports
          path: |
            reports/junit/package.xml
            reports/jest/package.json
          if-no-files-found: error

  supply-chain-audit:
    name: supply-chain audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Fetch protected refs for denylist scan
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if git fetch --prune --no-tags origin '+refs/heads/main:refs/remotes/origin/main'; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "::error::Could not fetch protected refs for denylist scan"
              exit 1
            fi
            sleep "$attempt"
          done
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --engine-strict
      - name: Reject injected audit fixtures
        run: |
          set -euo pipefail
          if [[ -n "${B2_MCP_AUDIT_REPORT_JSON:-}" ]]; then
            echo "::error::B2_MCP_AUDIT_REPORT_JSON is test-only and must not reach CI audit jobs"
            exit 1
          fi
      - run: npm run audit:supply-chain:denylist -- --ref HEAD --ref origin/main --packlist
      - run: npm run audit:supply-chain
        env:
          B2_MCP_AUDIT_EXPIRED_EXCEPTION_MODE: fail

  # Publish a `ci-green` ref at the commit that passed lint + tests on main. The
  # auto-deploy host watches this ref (read-only deploy key), so only CI-green
  # commits ever reach production. Runs only on a successful main push.
  mark-green:
    needs:
      [
        runtime-policy,
        runtime-engine-floor,
        package-budget,
        deterministic-linux-production,
        deterministic-linux-current,
        cross-platform-minimum,
        supply-chain-audit,
      ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: ci-green-${{ github.repository }}-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Advance ci-green if main is current
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"

          if [[ "$tested_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Checked-out HEAD ${tested_sha} does not match GITHUB_SHA ${GITHUB_SHA}"
            exit 1
          fi
          if [[ -z "$current_main_sha" ]]; then
            echo "::error::Could not resolve remote refs/heads/main"
            exit 1
          fi
          if [[ "$current_main_sha" != "$GITHUB_SHA" ]]; then
            echo "::notice::Skipping ci-green update for stale run ${GITHUB_SHA}; current main is ${current_main_sha}"
            exit 0
          fi

          git push origin "${GITHUB_SHA}:refs/heads/ci-green" --force
          echo "::notice::Advanced ci-green to ${GITHUB_SHA}"
