name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - run: pnpm run check:runtime-policy

  runtime-engine-floor:
    name: packed runtime consumer / Node 22.3.0
    needs: runtime-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.3.0
      - name: Run Node 22.3.0 runtime compatibility smoke
        run: node scripts/packed-consumer-smoke.mjs

  package-budget:
    name: package budget
    needs: runtime-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run check:package-budget
      - name: Upload package budget reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: package-budget
          path: reports/package-budget/
          if-no-files-found: error

  deterministic-linux-production:
    name: deterministic linux production / Node ${{ matrix.node-version }}
    needs: runtime-policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.23.1]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run spell
      - run: pnpm run lint:docs
      - run: pnpm run build
      - id: typecheck
        continue-on-error: true
        run: pnpm run typecheck
      - id: coverage
        name: Enforce global coverage floors
        continue-on-error: true
        run: pnpm run test:coverage
      - name: Publish coverage summary
        if: always()
        run: |
          echo "## Coverage summary" >> "$GITHUB_STEP_SUMMARY"
          echo "Required: statements 82%, branches 72%, functions 86%, lines 86%." >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              const fmt = (m) => \`\${m.pct.toFixed(2).padStart(6)}%  (\${m.covered}/\${m.total})\`;
              console.log('statements:', fmt(s.statements));
              console.log('branches:  ', fmt(s.branches));
              console.log('functions: ', fmt(s.functions));
              console.log('lines:     ', fmt(s.lines));
            " >> "$GITHUB_STEP_SUMMARY"
          else
            echo '(coverage-summary.json not found)' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - id: slow
        continue-on-error: true
        run: pnpm run test:slow
      - id: package-smoke
        continue-on-error: true
        run: pnpm run smoke:package
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: test-reports-node-${{ matrix.node-version }}
          path: |
            reports/junit/*.xml
            reports/vitest/*.json
            coverage/coverage-summary.json
            coverage/cobertura-coverage.xml
          if-no-files-found: error
      - name: Fail on test errors
        if: >-
          steps.typecheck.outcome == 'failure' ||
          steps.coverage.outcome == 'failure' ||
          steps.slow.outcome == 'failure' ||
          steps.package-smoke.outcome == 'failure'
        run: exit 1

  deterministic-linux-current:
    name: deterministic linux current / Node ${{ matrix.node-version }}
    needs: runtime-policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run spell
      - run: pnpm run lint:docs
      - run: pnpm run build
      - id: typecheck
        continue-on-error: true
        run: pnpm run typecheck
      - id: coverage
        name: Enforce global coverage floors
        continue-on-error: true
        run: pnpm run test:coverage
      - name: Publish coverage summary
        if: always()
        run: |
          echo "## Coverage summary" >> "$GITHUB_STEP_SUMMARY"
          echo "Required: statements 82%, branches 72%, functions 86%, lines 86%." >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              const fmt = (m) => \`\${m.pct.toFixed(2).padStart(6)}%  (\${m.covered}/\${m.total})\`;
              console.log('statements:', fmt(s.statements));
              console.log('branches:  ', fmt(s.branches));
              console.log('functions: ', fmt(s.functions));
              console.log('lines:     ', fmt(s.lines));
            " >> "$GITHUB_STEP_SUMMARY"
          else
            echo '(coverage-summary.json not found)' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - id: slow
        continue-on-error: true
        run: pnpm run test:slow
      - id: package-smoke
        continue-on-error: true
        run: pnpm run smoke:package
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: test-reports-node-${{ matrix.node-version }}
          path: |
            reports/junit/*.xml
            reports/vitest/*.json
            coverage/coverage-summary.json
            coverage/cobertura-coverage.xml
          if-no-files-found: error
      - name: Fail on test errors
        if: >-
          steps.typecheck.outcome == 'failure' ||
          steps.coverage.outcome == 'failure' ||
          steps.slow.outcome == 'failure' ||
          steps.package-smoke.outcome == 'failure'
        run: exit 1

  cross-platform-minimum:
    name: cross-platform minimum / ${{ matrix.os }}
    needs: runtime-policy
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test:cross-platform

  package:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:package
      - name: Upload package test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: package-test-reports
          path: |
            reports/junit/package.xml
            reports/vitest/package.json
          if-no-files-found: error

  supply-chain-audit:
    name: supply-chain audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Fetch protected refs for denylist scan
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if git fetch --prune --no-tags origin '+refs/heads/main:refs/remotes/origin/main'; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "::error::Could not fetch protected refs for denylist scan"
              exit 1
            fi
            sleep "$attempt"
          done
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reject injected audit fixtures
        run: |
          set -euo pipefail
          if [[ -n "${B2_MCP_AUDIT_REPORT_JSON:-}" ]]; then
            echo "::error::B2_MCP_AUDIT_REPORT_JSON is test-only and must not reach CI audit jobs"
            exit 1
          fi
      - run: pnpm run audit:supply-chain:denylist --ref HEAD --ref origin/main --packlist
      - run: pnpm run audit:supply-chain
        env:
          B2_MCP_AUDIT_EXPIRED_EXCEPTION_MODE: fail

  # Publish a `ci-green` ref at the commit that passed lint + tests on main. The
  # auto-deploy host watches this ref (read-only deploy key), so only CI-green
  # commits ever reach production. Runs only on a successful main push.
  mark-green:
    needs:
      [
        runtime-policy,
        runtime-engine-floor,
        package-budget,
        deterministic-linux-production,
        deterministic-linux-current,
        cross-platform-minimum,
        supply-chain-audit,
      ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: ci-green-${{ github.repository }}-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Advance ci-green if main is current
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"

          if [[ "$tested_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Checked-out HEAD ${tested_sha} does not match GITHUB_SHA ${GITHUB_SHA}"
            exit 1
          fi
          if [[ -z "$current_main_sha" ]]; then
            echo "::error::Could not resolve remote refs/heads/main"
            exit 1
          fi
          if [[ "$current_main_sha" != "$GITHUB_SHA" ]]; then
            echo "::notice::Skipping ci-green update for stale run ${GITHUB_SHA}; current main is ${current_main_sha}"
            exit 0
          fi

          git push origin "${GITHUB_SHA}:refs/heads/ci-green" --force
          echo "::notice::Advanced ci-green to ${GITHUB_SHA}"
