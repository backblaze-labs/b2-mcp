name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime-policy:
    name: runtime policy
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # pnpm/action-setup v6.0.10, reviewed 2026-08-06.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - run: pnpm run check:runtime-policy

  format-lint-typecheck:
    name: format/lint/typecheck
    needs: runtime-policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # pnpm/action-setup v6.0.10, reviewed 2026-08-06.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run local verification entry point
        run: pnpm run verify
      - name: Run local runtime smoke
        run: pnpm run smoke:local
      # actions/upload-artifact v6, reviewed 2026-08-06.
      - name: Upload primary verification reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: primary-verify-reports
          path: |
            reports/junit/*.xml
            reports/vitest/*.json
          if-no-files-found: warn
          retention-days: 7

  docs-spelling-links:
    name: docs/spelling/links
    needs: runtime-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # pnpm/action-setup v6.0.10, reviewed 2026-08-06.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint:docs
      - run: pnpm run spell
      - run: pnpm run lint:links

  unit-coverage-matrix:
    name: unit coverage Linux / Node ${{ matrix.node-version }}
    needs: runtime-policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.23.1, 24, 26]
    steps:
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # pnpm/action-setup v6.0.10, reviewed 2026-08-06.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test:coverage
      - name: Publish coverage summary
        if: always()
        run: |
          echo "## Coverage summary" >> "$GITHUB_STEP_SUMMARY"
          echo "Node.js ${{ matrix.node-version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Required: statements 90.5%, branches 81.8%, functions 94.6%, lines 93.8%." >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              const fmt = (m) => \`\${m.pct.toFixed(2).padStart(6)}%  (\${m.covered}/\${m.total})\`;
              console.log('statements:', fmt(s.statements));
              console.log('branches:  ', fmt(s.branches));
              console.log('functions: ', fmt(s.functions));
              console.log('lines:     ', fmt(s.lines));
            " >> "$GITHUB_STEP_SUMMARY"
          else
            echo '(coverage-summary.json not found)' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      # actions/upload-artifact v6, reviewed 2026-08-06.
      - name: Upload coverage and test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: coverage-and-tests-node-${{ matrix.node-version }}
          path: |
            coverage/**
            reports/junit/*.xml
            reports/vitest/*.json
          if-no-files-found: error
          retention-days: 7

  unit-coverage:
    name: unit/coverage
    needs: unit-coverage-matrix
    if: ${{ always() && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete coverage matrix
        run: |
          if [[ "${{ needs.unit-coverage-matrix.result }}" != "success" ]]; then
            echo "::error::unit coverage matrix result was ${{ needs.unit-coverage-matrix.result }}"
            exit 1
          fi

  reliability-resilience:
    name: reliability/resilience
    needs: runtime-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # pnpm/action-setup v6.0.10, reviewed 2026-08-06.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:reliability
      # actions/upload-artifact v6, reviewed 2026-08-06.
      - name: Upload reliability reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: reliability-resilience-node-22.23.1
          path: |
            reports/junit/reliability.xml
            reports/vitest/reliability.json
          if-no-files-found: error
          retention-days: 7

  mcp-contract:
    name: MCP contract
    needs: runtime-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # pnpm/action-setup v6.0.10, reviewed 2026-08-06.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test:contract
      # actions/upload-artifact v6, reviewed 2026-08-06.
      - name: Upload contract artifacts and reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: mcp-contract-node-22.23.1
          path: |
            docs/tool-profile-contract.json
            tests/fixtures/tool-contract/*.json
            reports/junit/contract.xml
            reports/vitest/contract.json
          if-no-files-found: error
          retention-days: 7

  protocol-transport:
    name: modern and legacy protocol/transport
    needs: runtime-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # pnpm/action-setup v6.0.10, reviewed 2026-08-06.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:protocol
      # actions/upload-artifact v6, reviewed 2026-08-06.
      - name: Upload protocol reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: protocol-transport-node-22.23.1
          path: |
            reports/junit/protocol-*.xml
            reports/vitest/protocol-*.json
          if-no-files-found: error
          retention-days: 7

  observability-logging:
    name: observability/logging behavior
    needs: runtime-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # pnpm/action-setup v6.0.10, reviewed 2026-08-06.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:observability
      # actions/upload-artifact v6, reviewed 2026-08-06.
      - name: Upload observability logging reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: observability-logging
          path: |
            reports/junit/observability.xml
            reports/vitest/observability.json
          if-no-files-found: error
          retention-days: 7

  package-install-smoke:
    name: package install smoke
    needs: runtime-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # pnpm/action-setup v6.0.10, reviewed 2026-08-06.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:package
      - name: Pack runtime floor tarball
        run: |
          mkdir -p reports/package/floor
          npm pack --json --ignore-scripts --pack-destination reports/package/floor > reports/package/runtime-floor-pack.json
      - name: Capture npm pack manifest
        run: |
          mkdir -p reports/package
          npm pack --json --dry-run > reports/package/npm-pack-manifest.json
      # actions/upload-artifact v6, reviewed 2026-08-06.
      - name: Upload package manifest and reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: package-install-smoke
          path: |
            reports/package/npm-pack-manifest.json
            reports/package/runtime-floor-pack.json
            reports/package/floor/*.tgz
            reports/junit/package.xml
            reports/vitest/package.json
          if-no-files-found: error
          retention-days: 7

  runtime-engine-floor:
    name: runtime engine floor
    needs: package-install-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.3.0
      # actions/download-artifact v6, reviewed 2026-08-06.
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: package-install-smoke
          path: reports/package-install-smoke
      - name: Run packed consumer smoke on Node.js 22.3.0
        run: |
          set -euo pipefail
          tarball="$(find reports/package-install-smoke -name '*.tgz' -type f -print -quit)"
          if [[ -z "$tarball" ]]; then
            echo "::error::package-install-smoke artifact did not contain a packed tarball"
            exit 1
          fi
          node scripts/packed-consumer-smoke.mjs --tarball "$tarball"
      - name: Run local runtime smoke on Node.js 22.3.0
        run: |
          set -euo pipefail
          tarball="$(find reports/package-install-smoke -name '*.tgz' -type f -print -quit)"
          if [[ -z "$tarball" ]]; then
            echo "::error::package-install-smoke artifact did not contain a packed tarball"
            exit 1
          fi
          tarball_path="$(realpath "$tarball")"
          smoke_root="$(mktemp -d)"
          (
            cd "$smoke_root"
            npm init -y >/dev/null
            npm install --ignore-scripts --omit=dev --no-audit --no-fund "$tarball_path"
          )
          B2_MCP_LOCAL_SMOKE_ROOT="$smoke_root/node_modules/@backblaze-labs/b2-mcp" \
            B2_MCP_LOCAL_SMOKE_SKIP_BUILD=true \
            node scripts/local-mcp-smoke.mjs

  production-dependency-audit-matrix:
    name: production dependency audit / Node ${{ matrix.node-version }}
    needs: runtime-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.23.1, 24, 26]
    steps:
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Reject injected audit fixtures
        run: |
          set -euo pipefail
          if [[ -n "${B2_MCP_AUDIT_REPORT_JSON:-}" ]]; then
            echo "::error::B2_MCP_AUDIT_REPORT_JSON is test-only and must not reach CI audit jobs"
            exit 1
          fi
          if [[ -n "${B2_MCP_AUDIT_POLICY_JSON:-}" ]]; then
            echo "::error::B2_MCP_AUDIT_POLICY_JSON is test-only and must not reach CI audit jobs"
            exit 1
          fi
          if [[ -n "${B2_MCP_PRODUCTION_GATE_ROOT:-}" ]]; then
            echo "::error::B2_MCP_PRODUCTION_GATE_ROOT is test-only and must not reach CI audit jobs"
            exit 1
          fi
      - run: node scripts/production-security-gate.mjs

  production-dependency-audit:
    name: production dependency audit
    needs: production-dependency-audit-matrix
    if: ${{ always() && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete production dependency audit matrix
        run: |
          if [[ "${{ needs.production-dependency-audit-matrix.result }}" != "success" ]]; then
            echo "::error::production dependency audit matrix result was ${{ needs.production-dependency-audit-matrix.result }}"
            exit 1
          fi

  package-budget:
    name: package budget
    needs: runtime-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # pnpm/action-setup v6.0.10, reviewed 2026-08-06.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run check:package-budget
      - run: pnpm run check:vercel-bundle
      - run: pnpm run check:cloudflare-worker-bundle
      # actions/upload-artifact v6, reviewed 2026-08-06.
      - name: Upload package budget reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: package-budget
          path: |
            reports/package-budget/
            reports/vercel-bundle/
            reports/cloudflare-worker-bundle/
          if-no-files-found: error
          retention-days: 7

  vercel-build-output:
    name: Vercel build output scan
    needs: runtime-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # pnpm/action-setup v6.0.10, reviewed 2026-08-06.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Seed deterministic Vercel leak canaries
        run: node scripts/print-vercel-build-canaries.mjs >> "${GITHUB_ENV}"
      - run: pnpm run prepare:vercel-local-build
        env:
          VERCEL_TOKEN: ""
      - run: pnpm run build:vercel-local
      - run: pnpm run check:vercel-build-output
      - run: pnpm run audit:supply-chain:denylist --artifacts-dir .vercel/output
      # actions/upload-artifact v6, reviewed 2026-08-06.
      - name: Upload Vercel build scan reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: vercel-build-output-scan
          path: |
            reports/vercel-build-output/
          if-no-files-found: error
          retention-days: 7

  container-image:
    name: container image
    needs: runtime-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build and smoke Docker image
        run: node scripts/smoke-container-image.mjs --build --image "b2-mcp:${GITHUB_SHA}"

  supply-chain-audit:
    name: supply-chain audit
    needs: runtime-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify protected refs for denylist scan
        run: |
          set -euo pipefail
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "::error::origin/main is missing from checkout; fetch-depth: 0 must fetch protected refs"
            exit 1
          fi
      # pnpm/action-setup v6.0.10, reviewed 2026-08-06.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run audit:supply-chain:denylist --ref HEAD --ref origin/main --packlist
      - run: pnpm run audit:supply-chain
        env:
          B2_MCP_AUDIT_EXPIRED_EXCEPTION_MODE: fail

  codeql-workflow-security:
    name: CodeQL/workflow security
    needs: runtime-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # github/codeql-action/init v4.37.6, reviewed 2026-08-06.
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          languages: javascript-typescript
          build-mode: none
      # github/codeql-action/analyze v4.37.6, reviewed 2026-08-06.
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          category: "/language:javascript-typescript"
          upload: never
      - name: Run digest-pinned offline zizmor
        env:
          ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.29.0@sha256:863026d54f91271b10b60b67ad8054cb37120167e162482597db102b3026a284
        run: |
          set -euo pipefail
          docker pull "${ZIZMOR_IMAGE}"
          docker run \
            --rm \
            --network=none \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            "${ZIZMOR_IMAGE}" \
            --persona=regular \
            --format=github \
            --collect=default \
            --no-online-audits \
            --min-severity=medium \
            --min-confidence=medium \
            --color=never \
            -- \
            .

  slow-lifecycle:
    name: slow/lifecycle
    needs: runtime-policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITEST_MAX_WORKERS: 1
      VITEST_MIN_WORKERS: 1
    steps:
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # pnpm/action-setup v6.0.10, reviewed 2026-08-06.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test:slow -- --maxWorkers=1
      # actions/upload-artifact v6, reviewed 2026-08-06.
      - name: Upload slow lifecycle reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: slow-lifecycle
          path: |
            reports/junit/slow.xml
            reports/vitest/slow.json
          if-no-files-found: error
          retention-days: 7

  cross-platform-minimum-matrix:
    name: cross-platform minimum / ${{ matrix.os }}
    needs: runtime-policy
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # pnpm/action-setup v6.0.10, reviewed 2026-08-06.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test:cross-platform

  cross-platform-minimum:
    name: cross-platform minimum
    needs: cross-platform-minimum-matrix
    if: ${{ always() && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete cross-platform minimum matrix
        run: |
          if [[ "${{ needs.cross-platform-minimum-matrix.result }}" != "success" ]]; then
            echo "::error::cross-platform minimum matrix result was ${{ needs.cross-platform-minimum-matrix.result }}"
            exit 1
          fi

  conformance-summary:
    name: conformance summary
    needs:
      - format-lint-typecheck
      - docs-spelling-links
      - unit-coverage
      - reliability-resilience
      - mcp-contract
      - protocol-transport
      - observability-logging
      - package-install-smoke
      - runtime-engine-floor
      - production-dependency-audit
      - package-budget
      - vercel-build-output
      - container-image
      - supply-chain-audit
      - codeql-workflow-security
      - slow-lifecycle
      - cross-platform-minimum
    if: ${{ always() && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Publish Phase 1 conformance summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          # Phase 1 Conformance

          | Evidence | Revision or scope |
          | --- | --- |
          | Modern MCP protocol | 2026-07-28 over Streamable HTTP and stdio |
          | Legacy MCP fallback | 2025-era stateless initialize compatibility |
          | Observability logging | Structured lifecycle, warning, failure, redaction, and stream-separation canaries |
          | Linux deterministic Node matrix | 22.23.1, 24, 26 |
          | Deterministic dependency failures | B2/S3/OAuth outage suite |
          | Runtime engine floor | Node.js 22.3.0 package install smoke |
          | Cross-platform fast suite | Linux, Windows, macOS on Node.js 22.23.1 |
          | Package budget metrics | Uploaded as package-budget artifact |
          | Vercel adapter budget | Uploaded as vercel-bundle artifact path |
          | Vercel build output | Real Vercel build plus leak scan |
          | Cloudflare Worker adapter budget | Uploaded as cloudflare-worker-bundle artifact path |
          | Container image | Docker build plus HTTP health/readiness smoke |
          | Required issue | backblaze-labs/b2-mcp#50 |
          SUMMARY

  mark-green:
    name: ci-green marker
    needs:
      - format-lint-typecheck
      - docs-spelling-links
      - unit-coverage
      - reliability-resilience
      - mcp-contract
      - protocol-transport
      - observability-logging
      - package-install-smoke
      - runtime-engine-floor
      - production-dependency-audit
      - package-budget
      - vercel-build-output
      - container-image
      - supply-chain-audit
      - codeql-workflow-security
      - slow-lifecycle
      - cross-platform-minimum
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: ci-green-${{ github.repository }}-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - name: Advance owned ci-green marker if main is current
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"

          if [[ "$tested_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Checked-out HEAD ${tested_sha} does not match GITHUB_SHA ${GITHUB_SHA}"
            exit 1
          fi
          if [[ -z "$current_main_sha" ]]; then
            echo "::error::Could not resolve remote refs/heads/main"
            exit 1
          fi
          if [[ "$current_main_sha" != "$GITHUB_SHA" ]]; then
            echo "::notice::Skipping ci-green update for stale run ${GITHUB_SHA}; current main is ${current_main_sha}"
            exit 0
          fi

          git push origin "${GITHUB_SHA}:refs/heads/ci-green" --force
          echo "::notice::Advanced owned ci-green marker to ${GITHUB_SHA}"
