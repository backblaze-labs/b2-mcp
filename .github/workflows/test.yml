name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.3.0
      - run: npm run check:runtime-policy

  deterministic-linux:
    name: deterministic linux / Node ${{ matrix.node-version }}
    needs: runtime-policy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.3.0, 24, 26]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run test:integration
      - run: npm run test:contract
      - run: npm run build
      - run: npm run smoke:package
      - run: npm audit --omit=dev --audit-level=high

  cross-platform-minimum:
    name: cross-platform minimum / ${{ matrix.os }}
    needs: runtime-policy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.3.0
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run build
      - run: npm run test:cross-platform

  package:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run test:package
      - name: Upload package test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: package-test-reports
          path: |
            reports/junit/package.xml
            reports/jest/package.json
          if-no-files-found: error

  # Publish a `ci-green` ref at the commit that passed lint + tests on main. The
  # auto-deploy host watches this ref (read-only deploy key), so only CI-green
  # commits ever reach production. Runs only on a successful main push.
  mark-green:
    needs: [runtime-policy, deterministic-linux, cross-platform-minimum]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - run: git push origin "HEAD:refs/heads/ci-green" --force
