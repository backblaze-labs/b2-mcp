name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --engine-strict

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run lint
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run build
      - id: typecheck
        continue-on-error: true
        run: npm run typecheck
      - id: coverage
        continue-on-error: true
        run: npm run test:coverage
      - id: slow
        continue-on-error: true
        run: npm run test:slow
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            reports/junit/*.xml
            reports/jest/*.json
            coverage/coverage-summary.json
            coverage/cobertura-coverage.xml
          if-no-files-found: error
      - name: Fail on test errors
        if: >-
          steps.typecheck.outcome == 'failure' ||
          steps.coverage.outcome == 'failure' ||
          steps.slow.outcome == 'failure'
        run: |
          echo "typecheck=${{ steps.typecheck.outcome }} coverage=${{ steps.coverage.outcome }} slow=${{ steps.slow.outcome }}"
          exit 1

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run test:package
      - name: Upload package test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: package-test-reports
          path: |
            reports/junit/package.xml
            reports/jest/package.json
          if-no-files-found: error

  # Publish a `ci-green` ref at the commit that passed lint + tests on main. The
  # auto-deploy host watches this ref (read-only deploy key), so only CI-green
  # commits ever reach production. Runs only on a successful main push.
  mark-green:
    needs: [engine-floor, lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - run: git push origin "HEAD:refs/heads/ci-green" --force
