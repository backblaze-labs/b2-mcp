name: Live B2 Contract

# Live B2 contract and integration evidence. Mocked tests previously missed
# request-shape regressions in notification rules and Object Lock payloads, so
# these reviewed manual/schedule/release jobs exercise real B2 requests. They do
# not run on pull_request because protected credentials must never share a job
# with unreviewed PR-head package code, and they create/delete only
# `mcp-contract-*` resources in the dedicated protected live test account.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
  workflow_call:
    inputs:
      checkout-sha:
        description: Exact release candidate commit SHA resolved by the caller.
        required: true
        type: string
    secrets:
      LIVE_B2_KEY_ID:
        required: true
      LIVE_B2_KEY:
        required: true
      LIVE_B2_MASTER_KEY_ID:
        required: false
      LIVE_B2_MASTER_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: live-b2-contract-${{ github.repository }}-resources
  cancel-in-progress: false

jobs:
  guard:
    if: github.repository == 'backblaze-labs/b2-mcp'
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.ref.outputs.should_run }}
      checkout-sha: ${{ steps.ref.outputs.checkout_sha }}
      run-prefix: ${{ steps.ref.outputs.run_prefix }}
    steps:
      - name: Resolve trusted live-test ref
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_CALL_CHECKOUT_SHA: ${{ inputs['checkout-sha'] || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          should_run=true
          checkout_sha="${GITHUB_SHA}"
          event_kind="${EVENT_NAME}"
          if [[ -n "${WORKFLOW_CALL_CHECKOUT_SHA}" ]]; then
            event_kind="workflow_call"
          fi

          case "${event_kind}" in
            workflow_dispatch)
              if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
                echo "::error::workflow_dispatch must run from main; got ${GITHUB_REF}"
                exit 1
              fi
              ;;
            schedule)
              if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
                echo "::error::${EVENT_NAME} live contract runs must target main; got ${GITHUB_REF}"
                exit 1
              fi
              ;;
            workflow_call)
              if [[ ! "${WORKFLOW_CALL_CHECKOUT_SHA}" =~ ^[a-f0-9]{40}$ ]]; then
                echo "::error::workflow_call requires a full checkout-sha commit."
                exit 1
              fi
              git init --quiet /tmp/live-ref-check
              cd /tmp/live-ref-check
              git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
              GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')" \
              git fetch --no-tags origin '+refs/heads/ci-green:refs/remotes/origin/ci-green'
              if ! git cat-file -e "${WORKFLOW_CALL_CHECKOUT_SHA}^{commit}"; then
                echo "::error::workflow_call checkout-sha is not reachable from ci-green."
                exit 1
              fi
              if ! git merge-base --is-ancestor "${WORKFLOW_CALL_CHECKOUT_SHA}" refs/remotes/origin/ci-green; then
                echo "::error::workflow_call checkout-sha must be reachable from refs/heads/ci-green before live credentials are exposed."
                exit 1
              fi
              checkout_sha="${WORKFLOW_CALL_CHECKOUT_SHA}"
              ;;
            *)
              echo "::error::unsupported live-test event: ${EVENT_NAME}"
              exit 1
              ;;
          esac

          run_prefix="mcp-contract-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"
          echo "checkout_sha=${checkout_sha}" >> "$GITHUB_OUTPUT"
          echo "run_prefix=${run_prefix}" >> "$GITHUB_OUTPUT"

  preflight:
    name: live B2 preflight
    needs: guard
    if: needs.guard.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # Trusted live contract runs require these together: preflight validates
      # configuration, profile, account, and capabilities before the Node matrix.
      B2_REQUIRE_LIVE_TESTS: "1"
      B2_INTEGRATION_REQUIRE_CREDENTIALS: "1"
      B2_MCP_LIVE_RUN_PREFIX: ${{ needs.guard.outputs.run-prefix }}-preflight
    steps:
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.guard.outputs.checkout-sha }}
          persist-credentials: false
      # pnpm/action-setup v6.0.10, reviewed 2026-08-06.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Validate live B2 configuration before Node matrix
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.LIVE_B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.LIVE_B2_KEY }}
          B2_LIVE_TEST_ACCOUNT_ID: ${{ vars.B2_LIVE_TEST_ACCOUNT_ID }}
          B2_REGION: ${{ vars.B2_REGION }}
          B2_MASTER_KEY_ID: ${{ secrets.LIVE_B2_MASTER_KEY_ID }}
          B2_MASTER_KEY: ${{ secrets.LIVE_B2_MASTER_KEY }}
          B2_LIVE_NOTIFICATION_BUCKET: ${{ vars.B2_LIVE_NOTIFICATION_BUCKET }}
          B2_MCP_EXPECTED_TOOL_PROFILE: ${{ vars.B2_MCP_EXPECTED_TOOL_PROFILE }}
        run: |
          set -euo pipefail
          mkdir -p reports/live-b2
          node scripts/live-b2-evidence.mjs preflight --out reports/live-b2/preflight.json
      # actions/upload-artifact v6, reviewed 2026-08-06.
      - name: Upload live B2 preflight evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: live-b2-preflight-isolation-cleanup
          path: reports/live-b2/preflight.json
          if-no-files-found: warn
          retention-days: 14

  contract:
    name: live B2 contract / Node ${{ matrix.node-version }}
    needs: [guard, preflight]
    if: needs.guard.outputs.should-run == 'true' && needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        node-version: [22.23.1, 24, 26]
    env:
      # Trusted live contract runs require these together: the Vitest guard fails
      # loudly on missing credentials, and fixture helpers enforce account scope.
      B2_REQUIRE_LIVE_TESTS: "1"
      B2_INTEGRATION_REQUIRE_CREDENTIALS: "1"
      B2_MCP_LIVE_RUN_PREFIX: ${{ needs.guard.outputs.run-prefix }}-n${{ matrix.node-version }}
      B2_MCP_LIVE_RESOURCE_LEDGER: reports/live-b2/resources-node-${{ matrix.node-version }}.jsonl
      MATRIX_NODE_VERSION: ${{ matrix.node-version }}
    steps:
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.guard.outputs.checkout-sha }}
          persist-credentials: false
      # pnpm/action-setup v6.0.10, reviewed 2026-08-06.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Prepare live B2 evidence directory
        run: mkdir -p reports/live-b2
      - name: Validate live B2 matrix leg
        id: matrix_validation
        continue-on-error: true
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.LIVE_B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.LIVE_B2_KEY }}
          B2_LIVE_TEST_ACCOUNT_ID: ${{ vars.B2_LIVE_TEST_ACCOUNT_ID }}
          B2_REGION: ${{ vars.B2_REGION }}
          B2_MASTER_KEY_ID: ${{ secrets.LIVE_B2_MASTER_KEY_ID }}
          B2_MASTER_KEY: ${{ secrets.LIVE_B2_MASTER_KEY }}
          B2_LIVE_NOTIFICATION_BUCKET: ${{ vars.B2_LIVE_NOTIFICATION_BUCKET }}
          B2_MCP_EXPECTED_TOOL_PROFILE: ${{ vars.B2_MCP_EXPECTED_TOOL_PROFILE }}
          B2_MCP_LIVE_RUN_PREFIX: ${{ env.B2_MCP_LIVE_RUN_PREFIX }}
          B2_MCP_LIVE_RESOURCE_LEDGER: ${{ env.B2_MCP_LIVE_RESOURCE_LEDGER }}
        run: |
          set -euo pipefail
          node scripts/live-b2-evidence.mjs preflight \
            --out "reports/live-b2/validation-node-${{ matrix.node-version }}.json"
      - name: Run live B2 contract and integration suites
        id: live_tests
        if: steps.matrix_validation.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 12
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.LIVE_B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.LIVE_B2_KEY }}
          B2_LIVE_TEST_ACCOUNT_ID: ${{ vars.B2_LIVE_TEST_ACCOUNT_ID }}
          B2_REGION: ${{ vars.B2_REGION }}
          B2_MASTER_KEY_ID: ${{ secrets.LIVE_B2_MASTER_KEY_ID }}
          B2_MASTER_KEY: ${{ secrets.LIVE_B2_MASTER_KEY }}
          B2_LIVE_NOTIFICATION_BUCKET: ${{ vars.B2_LIVE_NOTIFICATION_BUCKET }}
          B2_MCP_EXPECTED_TOOL_PROFILE: ${{ vars.B2_MCP_EXPECTED_TOOL_PROFILE }}
          B2_MCP_LIVE_RUN_PREFIX: ${{ env.B2_MCP_LIVE_RUN_PREFIX }}
          B2_MCP_LIVE_RESOURCE_LEDGER: ${{ env.B2_MCP_LIVE_RESOURCE_LEDGER }}
        run: pnpm run test:live:b2
      - name: Clean current live B2 run resources
        id: cleanup
        if: always()
        continue-on-error: true
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.LIVE_B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.LIVE_B2_KEY }}
          B2_LIVE_TEST_ACCOUNT_ID: ${{ vars.B2_LIVE_TEST_ACCOUNT_ID }}
          B2_REGION: ${{ vars.B2_REGION }}
          B2_MASTER_KEY_ID: ${{ secrets.LIVE_B2_MASTER_KEY_ID }}
          B2_MASTER_KEY: ${{ secrets.LIVE_B2_MASTER_KEY }}
          B2_LIVE_NOTIFICATION_BUCKET: ${{ vars.B2_LIVE_NOTIFICATION_BUCKET }}
          B2_MCP_EXPECTED_TOOL_PROFILE: ${{ vars.B2_MCP_EXPECTED_TOOL_PROFILE }}
          B2_MCP_LIVE_RUN_PREFIX: ${{ env.B2_MCP_LIVE_RUN_PREFIX }}
        run: |
          set -euo pipefail
          if [[ ! -f dist/server.js ]]; then
            echo "::notice::dist/server.js is missing; no live resources should have been created before build."
            exit 0
          fi
          node scripts/live-b2-janitor.mjs \
            --prefix "${B2_MCP_LIVE_RUN_PREFIX}" \
            --summary-json "reports/live-b2/cleanup-node-${{ matrix.node-version }}.json"
      - name: Publish live B2 isolation and cleanup evidence
        if: always()
        env:
          B2_MCP_EXPECTED_TOOL_PROFILE: ${{ vars.B2_MCP_EXPECTED_TOOL_PROFILE }}
          B2_MCP_LIVE_RUN_PREFIX: ${{ env.B2_MCP_LIVE_RUN_PREFIX }}
          B2_MCP_LIVE_RESOURCE_LEDGER: ${{ env.B2_MCP_LIVE_RESOURCE_LEDGER }}
          MATRIX_NODE_VERSION: ${{ matrix.node-version }}
        run: |
          set -euo pipefail
          mkdir -p reports/live-b2
          node scripts/live-b2-evidence.mjs finalize \
            --out "reports/live-b2/isolation-cleanup-node-${{ matrix.node-version }}.json" \
            --resource-ledger "${B2_MCP_LIVE_RESOURCE_LEDGER}" \
            --cleanup-summary "reports/live-b2/cleanup-node-${{ matrix.node-version }}.json" \
            --validation-summary "reports/live-b2/validation-node-${{ matrix.node-version }}.json" \
            --preflight-outcome "${{ steps.matrix_validation.outcome }}" \
            --test-outcome "${{ steps.live_tests.outcome }}" \
            --cleanup-outcome "${{ steps.cleanup.outcome }}"
      # actions/upload-artifact v6, reviewed 2026-08-06.
      - name: Upload live B2 isolation and cleanup evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: live-b2-isolation-cleanup-node-${{ matrix.node-version }}
          path: reports/live-b2/isolation-cleanup-node-${{ matrix.node-version }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Require live B2 run success
        if: always()
        run: |
          set -euo pipefail
          failed=0
          if [[ "${{ steps.matrix_validation.outcome }}" != "success" ]]; then
            echo "::error::live B2 matrix validation outcome was ${{ steps.matrix_validation.outcome }}"
            failed=1
          fi
          if [[ "${{ steps.live_tests.outcome }}" != "success" ]]; then
            echo "::error::live B2 tests outcome was ${{ steps.live_tests.outcome }}"
            failed=1
          fi
          if [[ "${{ steps.cleanup.outcome }}" != "success" ]]; then
            echo "::error::live B2 cleanup outcome was ${{ steps.cleanup.outcome }}"
            failed=1
          fi
          exit "$failed"
