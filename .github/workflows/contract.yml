name: Live B2 Contract

# Live B2 contract and integration evidence. Mocked tests previously missed
# request-shape regressions in notification rules and Object Lock payloads, so
# these reviewed manual/schedule/release jobs exercise real B2 requests. They do
# not run on pull_request because protected credentials must never share a job
# with unreviewed PR-head package code, and they create/delete only
# `mcp-contract-*` resources in the dedicated protected live test account.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
  workflow_call:
    inputs:
      checkout-sha:
        description: Exact release candidate commit SHA resolved by the caller.
        required: true
        type: string
    secrets:
      LIVE_B2_KEY_ID:
        required: true
      LIVE_B2_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: live-b2-contract-${{ github.repository }}-resources
  cancel-in-progress: false

jobs:
  guard:
    if: github.repository == 'backblaze-labs/b2-mcp'
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.ref.outputs.should_run }}
      checkout-sha: ${{ steps.ref.outputs.checkout_sha }}
      run-prefix: ${{ steps.ref.outputs.run_prefix }}
    steps:
      - name: Resolve trusted live-test ref
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_CALL_CHECKOUT_SHA: ${{ inputs['checkout-sha'] || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          should_run=true
          checkout_sha="${GITHUB_SHA}"
          event_kind="${EVENT_NAME}"
          if [[ -n "${WORKFLOW_CALL_CHECKOUT_SHA}" ]]; then
            event_kind="workflow_call"
          fi

          case "${event_kind}" in
            workflow_dispatch)
              if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
                echo "::error::workflow_dispatch must run from main; got ${GITHUB_REF}"
                exit 1
              fi
              ;;
            schedule)
              if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
                echo "::error::${EVENT_NAME} live contract runs must target main; got ${GITHUB_REF}"
                exit 1
              fi
              ;;
            workflow_call)
              if [[ ! "${WORKFLOW_CALL_CHECKOUT_SHA}" =~ ^[a-f0-9]{40}$ ]]; then
                echo "::error::workflow_call requires a full checkout-sha commit."
                exit 1
              fi
              git init --quiet /tmp/live-ref-check
              cd /tmp/live-ref-check
              git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
              GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')" \
              git fetch --no-tags origin '+refs/heads/ci-green:refs/remotes/origin/ci-green'
              if ! git cat-file -e "${WORKFLOW_CALL_CHECKOUT_SHA}^{commit}"; then
                echo "::error::workflow_call checkout-sha is not reachable from ci-green."
                exit 1
              fi
              if ! git merge-base --is-ancestor "${WORKFLOW_CALL_CHECKOUT_SHA}" refs/remotes/origin/ci-green; then
                echo "::error::workflow_call checkout-sha must be reachable from refs/heads/ci-green before live credentials are exposed."
                exit 1
              fi
              checkout_sha="${WORKFLOW_CALL_CHECKOUT_SHA}"
              ;;
            *)
              echo "::error::unsupported live-test event: ${EVENT_NAME}"
              exit 1
              ;;
          esac

          run_prefix="mcp-contract-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"
          echo "checkout_sha=${checkout_sha}" >> "$GITHUB_OUTPUT"
          echo "run_prefix=${run_prefix}" >> "$GITHUB_OUTPUT"

  contract:
    name: live B2 contract / Node ${{ matrix.node-version }}
    needs: guard
    if: needs.guard.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        node-version: [22.23.1, 24, 26]
    env:
      # Trusted live contract runs require these together: the Vitest guard fails
      # loudly on missing credentials, and fixture helpers enforce account scope.
      B2_REQUIRE_LIVE_TESTS: "1"
      B2_INTEGRATION_REQUIRE_CREDENTIALS: "1"
      B2_MCP_LIVE_RUN_PREFIX: ${{ needs.guard.outputs.run-prefix }}-n${{ matrix.node-version }}
    steps:
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.guard.outputs.checkout-sha }}
          persist-credentials: false
      # pnpm/action-setup v6.0.10, reviewed 2026-08-06.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Validate live B2 environment
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.LIVE_B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.LIVE_B2_KEY }}
          B2_LIVE_TEST_ACCOUNT_ID: ${{ vars.B2_LIVE_TEST_ACCOUNT_ID }}
          B2_MCP_LIVE_RUN_PREFIX: ${{ env.B2_MCP_LIVE_RUN_PREFIX }}
        run: |
          set -euo pipefail
          echo "::add-mask::${B2_MCP_LIVE_RUN_PREFIX}"
          if [[ -n "${B2_LIVE_TEST_ACCOUNT_ID:-}" ]]; then echo "::add-mask::${B2_LIVE_TEST_ACCOUNT_ID}"; fi
          missing=0
          for name in B2_APPLICATION_KEY_ID B2_APPLICATION_KEY B2_LIVE_TEST_ACCOUNT_ID B2_MCP_LIVE_RUN_PREFIX; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required live-b2-contract variable or secret for ${name}"
              missing=1
            fi
          done
          if [[ "${B2_REQUIRE_LIVE_TESTS:-}" != "1" || "${B2_INTEGRATION_REQUIRE_CREDENTIALS:-}" != "1" ]]; then
            echo "::error::Trusted live-b2-contract runs must set B2_REQUIRE_LIVE_TESTS=1 and B2_INTEGRATION_REQUIRE_CREDENTIALS=1 together"
            missing=1
          fi
          if [[ "$missing" != 0 ]]; then exit "$missing"; fi
          node --input-type=module <<'NODE'
          import { B2AuthManager } from "./dist/auth.js";
          import { loadConfig } from "./dist/server.js";
          import liveB2Capabilities from "./scripts/lib/live-b2-capabilities.cjs";

          const {
            LIVE_B2_CONTRACT_FORBIDDEN_CAPABILITIES: forbiddenCapabilities,
            LIVE_B2_CONTRACT_REQUIRED_CAPABILITIES: requiredCapabilities,
          } = liveB2Capabilities;
          const auth = await new B2AuthManager(loadConfig()).getAuth();
          if (auth.accountId !== process.env.B2_LIVE_TEST_ACCOUNT_ID) {
            throw new Error("authorized account does not match B2_LIVE_TEST_ACCOUNT_ID");
          }
          const missingCapabilities = requiredCapabilities.filter(
            (capability) => !auth.capabilities.includes(capability),
          );
          if (missingCapabilities.length > 0) {
            throw new Error(
              `live B2 contract key is missing required capability: ${missingCapabilities.join(", ")}`,
            );
          }
          const forbiddenGrantedCapabilities = forbiddenCapabilities.filter((capability) =>
            auth.capabilities.includes(capability),
          );
          if (forbiddenGrantedCapabilities.length > 0) {
            throw new Error(
              `live B2 contract key grants forbidden capability: ${forbiddenGrantedCapabilities.join(", ")}`,
            );
          }
          NODE
      - name: Run live B2 contract and integration suites
        timeout-minutes: 12
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.LIVE_B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.LIVE_B2_KEY }}
          B2_LIVE_TEST_ACCOUNT_ID: ${{ vars.B2_LIVE_TEST_ACCOUNT_ID }}
          B2_MCP_LIVE_RUN_PREFIX: ${{ env.B2_MCP_LIVE_RUN_PREFIX }}
        run: pnpm run test:live:b2
      - name: Clean current live B2 run resources
        if: always()
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.LIVE_B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.LIVE_B2_KEY }}
          B2_LIVE_TEST_ACCOUNT_ID: ${{ vars.B2_LIVE_TEST_ACCOUNT_ID }}
          B2_MCP_LIVE_RUN_PREFIX: ${{ env.B2_MCP_LIVE_RUN_PREFIX }}
        run: |
          set -euo pipefail
          if [[ ! -f dist/server.js ]]; then
            echo "::notice::dist/server.js is missing; no live resources should have been created before build."
            exit 0
          fi
          node scripts/live-b2-janitor.mjs --prefix "${B2_MCP_LIVE_RUN_PREFIX}"
