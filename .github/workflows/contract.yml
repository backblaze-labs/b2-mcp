name: Contract

# Live request-shape contract tests (tests/live/request-shape.contract.live.test.ts).
#
# Mocked unit tests cannot catch a tool that sends the wrong payload SHAPE to B2 —
# two real bugs shipped that way (notification objectNamePrefix; Object Lock
# retention/legal-hold response-shaped requests) and were only caught by hand.
# These drive the real B2 write API so a shape regression fails CI instead.
#
# Triggers:
#   - workflow_dispatch:  manual trigger from the Actions tab, from main only
#   - release.published:  before a tagged release goes out, only when the tag
#                         points at the ci-green ref
# Deliberately NOT on every PR: each run creates + deletes a real Object-Lock
# bucket, and per-PR churn against the demo account isn't worth it.
#
# Gated to the canonical org repo so personal mirrors don't fire failing runs
# (they don't have the credentials set as secrets).
#
# B2 secrets must live in the protected `live-b2-contract` environment. The
# workflow checks out the resolved `ci-green` commit before package code sees
# secrets and rejects release tags that do not point at `ci-green`. Add required
# reviewers when the repository plan supports environment reviewers.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: live-b2-contract-${{ github.repository }}
  cancel-in-progress: false

jobs:
  guard:
    if: github.repository == 'backblaze-labs/b2-mcp'
    runs-on: ubuntu-latest
    outputs:
      checkout-sha: ${{ steps.ref.outputs.checkout_sha }}
    steps:
      - name: Validate protected live-test ref
        id: ref
        run: |
          set -euo pipefail
          protected_ref="refs/heads/ci-green"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::workflow_dispatch must run from main; got ${GITHUB_REF}"
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
              echo "::error::release smoke/contract runs only accept v* tags; got ${GITHUB_REF}"
              exit 1
            fi
          else
            echo "::error::unsupported live-test event: ${GITHUB_EVENT_NAME}"
            exit 1
          fi

          git init --quiet /tmp/live-ref-check
          cd /tmp/live-ref-check
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          ci_green_sha="$(git ls-remote origin "${protected_ref}" | awk '{print $1}')"
          if [[ -z "$ci_green_sha" ]]; then
            echo "::error::protected ref ${protected_ref} is missing"
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            tag_sha="$(git ls-remote origin "${GITHUB_REF}^{}" | awk '{print $1}')"
            if [[ -z "$tag_sha" ]]; then
              tag_sha="$(git ls-remote origin "${GITHUB_REF}" | awk '{print $1}')"
            fi
            if [[ -z "$tag_sha" || "$tag_sha" != "$ci_green_sha" ]]; then
              echo "::error::release tag ${GITHUB_REF_NAME} must point at ${protected_ref}"
              echo "ci_green_sha=${ci_green_sha:-missing}"
              echo "tag_sha=${tag_sha:-missing}"
              exit 1
            fi
          fi

          echo "checkout_sha=${ci_green_sha}" >> "$GITHUB_OUTPUT"

  package-budget:
    name: release package budget
    needs: guard
    if: github.repository == 'backblaze-labs/b2-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.guard.outputs.checkout-sha }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run check:package-budget
      - name: Upload release package budget reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-package-budget
          path: reports/package-budget/
          if-no-files-found: error

  contract:
    name: live contract / Node ${{ matrix.node-version }}
    needs: guard
    if: github.repository == 'backblaze-labs/b2-mcp'
    runs-on: ubuntu-latest
    environment: live-b2-contract
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        node-version: [22.23.1, 24, 26]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.guard.outputs.checkout-sha }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Validate live B2 environment
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.LIVE_B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.LIVE_B2_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in B2_APPLICATION_KEY_ID B2_APPLICATION_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required live-b2-contract secret for ${name}"
              missing=1
            fi
          done
          exit "$missing"
      - run: pnpm run test:contract:live
        env:
          # Environment-scoped live B2 secrets. Do not use repo-level B2 secrets here.
          B2_APPLICATION_KEY_ID: ${{ secrets.LIVE_B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.LIVE_B2_KEY }}
      - name: Print cleanup context
        if: always()
        run: |
          echo "workflow=${GITHUB_WORKFLOW}"
          echo "run_id=${GITHUB_RUN_ID}"
          echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          echo "ref=${GITHUB_REF}"
          echo "contract_bucket_prefix=mcp-contract-"
          echo "contract_key_prefix=c-v"
