name: Contract

# Live request-shape contract tests (tests/integration/contract.test.ts).
#
# Mocked unit tests cannot catch a tool that sends the wrong payload SHAPE to B2 —
# two real bugs shipped that way (notification objectNamePrefix; Object Lock
# retention/legal-hold response-shaped requests) and were only caught by hand.
# These drive the real B2 write API so a shape regression fails CI instead.
#
# Triggers:
#   - workflow_dispatch:  manual trigger from the Actions tab
#   - release.published:  before a tagged release goes out
#   - schedule:           every 6 hours as a heartbeat
# Deliberately NOT on every PR: each run creates + deletes a real Object-Lock
# bucket, and per-PR churn against the demo account isn't worth it.
#
# Gated to the canonical org repo so personal mirrors don't fire failing runs
# (they don't have the credentials set as secrets).
#
# B2 secrets must live in the protected `live-b2-contract` environment, with
# branch/tag restrictions for `main` and protected `v*` tags. Add required
# reviewers there when the repository plan supports environment reviewers.

on:
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: "30 */6 * * *"

permissions:
  contents: read

concurrency:
  group: live-b2-contract-${{ github.repository }}
  cancel-in-progress: false

jobs:
  contract:
    if: >-
      github.repository == 'backblaze-labs/b2-mcp' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v'))
      )
    runs-on: ubuntu-latest
    environment: live-b2-contract
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:contract
        env:
          # Environment-scoped live B2 secrets. Do not use repo-level B2 secrets here.
          B2_APPLICATION_KEY_ID: ${{ secrets.LIVE_B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.LIVE_B2_KEY }}
          B2_APP_KEY_ID: ${{ secrets.LIVE_B2_APP_KEY_ID }}
          B2_APP_KEY: ${{ secrets.LIVE_B2_APP_KEY }}
      - name: Print cleanup context
        if: always()
        run: |
          echo "workflow=${GITHUB_WORKFLOW}"
          echo "run_id=${GITHUB_RUN_ID}"
          echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          echo "ref=${GITHUB_REF}"
          echo "contract_bucket_prefix=mcp-contract-"
          echo "contract_key_prefix=c-v"
