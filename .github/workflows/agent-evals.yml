name: Agent Evals

# Regression tests for the agent configuration (AGENTS.md, CLAUDE.md, .claude/,
# REVIEW.md, docs/review-lessons.md) against real past tasks in evals/agent/.
# See evals/agent/README.md. Like evals.yml, this never runs on pull_request, so
# ANTHROPIC_API_KEY (llm-evals environment) never meets unreviewed code. Without
# the secret the guard skips the run with a notice instead of failing.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: agent-evals-${{ github.repository }}
  cancel-in-progress: false

jobs:
  guard:
    if: github.repository == 'backblaze-labs/b2-mcp'
    runs-on: ubuntu-latest
    environment: llm-evals
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.ref.outputs.enabled }}
    steps:
      - name: Require main and an API key
        id: ref
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::agent evals run only against main; got ${GITHUB_REF}"
            exit 1
          fi
          if [[ -z "${ANTHROPIC_API_KEY:-}" ]]; then
            echo "::notice::ANTHROPIC_API_KEY is not configured in the llm-evals environment; skipping agent evals."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  evals:
    name: agent configuration evals
    needs: guard
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: llm-evals
    timeout-minutes: 90
    env:
      AGENT_EVAL_IMAGE: b2-mcp-agent-evals
    steps:
      # actions/checkout v7, reviewed 2026-08-25.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0 # each eval starts from an older commit
          persist-credentials: false
      # pnpm/action-setup v6.1.0, reviewed 2026-09-13.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - name: Install the locked Claude Code CLI
        run: pnpm --dir tools/agent-cli install --frozen-lockfile --ignore-scripts
      - name: Build the eval sandbox image
        run: docker build --tag "${AGENT_EVAL_IMAGE}" evals/agent
      # Agent and grader run in separate containers; the grader container gets
      # no credentials and read-only grading inputs (evals/agent/run-suite.sh).
      - name: Run agent eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: evals/agent/run-suite.sh
