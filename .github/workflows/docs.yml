# Builds the TypeDoc API reference and publishes api-docs/ to GitHub Pages from
# main only. Requires repo Pages source: GitHub Actions. Uses no B2 credentials.
name: Deploy API Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build API docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v7, reviewed 2026-08-25.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # pnpm/action-setup v6.0.10, reviewed 2026-08-06.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_RUNTIME_URL: ""
      - run: pnpm run docs
        env:
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_RUNTIME_URL: ""
      # actions/upload-pages-artifact v5, reviewed 2026-08-27.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: api-docs

  deploy:
    name: Deploy API docs
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/deploy-pages v5, reviewed 2026-08-27.
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
