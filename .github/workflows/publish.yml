name: Publish Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: v* tag to publish; must point at ci-green
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'backblaze-labs/b2-mcp'
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 15
    steps:
      - name: Resolve protected release ref
        id: ref
        env:
          PUBLISH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${PUBLISH_TAG}"
          if [[ "$tag" != v* ]]; then
            echo "::error::Publish tag must start with v; got ${tag}"
            exit 1
          fi

          git init --quiet /tmp/publish-ref-check
          cd /tmp/publish-ref-check
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          ci_green_sha="$(git ls-remote origin refs/heads/ci-green | awk '{print $1}')"
          tag_sha="$(git ls-remote origin "refs/tags/${tag}^{}" | awk '{print $1}')"
          if [[ -z "$tag_sha" ]]; then
            tag_sha="$(git ls-remote origin "refs/tags/${tag}" | awk '{print $1}')"
          fi

          if [[ -z "$ci_green_sha" ]]; then
            echo "::error::refs/heads/ci-green is missing"
            exit 1
          fi
          if [[ -z "$tag_sha" ]]; then
            echo "::error::refs/tags/${tag} is missing"
            exit 1
          fi
          if [[ "$tag_sha" != "$ci_green_sha" ]]; then
            echo "::error::refs/tags/${tag} must point at refs/heads/ci-green"
            echo "ci_green_sha=${ci_green_sha}"
            echo "tag_sha=${tag_sha}"
            exit 1
          fi

          echo "checkout_sha=${ci_green_sha}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.ref.outputs.checkout_sha }}
          fetch-depth: 0
      - name: Fetch branch refs for denylist scan
        run: git fetch --prune --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --engine-strict
      - run: npm run audit:supply-chain:denylist -- --all-branches --packlist
      - run: npm run audit:supply-chain
        env:
          B2_MCP_AUDIT_EXPIRED_EXCEPTION_MODE: fail
      - run: npm run typecheck
      - run: npm run build
      - name: Publish with trusted provenance
        run: npm publish --provenance --access public --ignore-scripts=false
