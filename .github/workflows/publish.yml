name: Publish Package

# Tag-driven release. Release owners cut a version with `pnpm version
# <patch|minor|major>` and push the resulting commit and `v*` tag with
# `git push --follow-tags`. The unprivileged Release Tag Request workflow
# receives the tag push or manual rerun request; this privileged workflow then
# runs from the default branch through workflow_run, checks out trusted resolver
# code from `ci-green`, and only then checks out the validated tag.
on:
  # zizmor: ignore[dangerous-triggers] This workflow_run only consumes an inert
  # tag artifact, checks out ci-green resolver code, validates protected refs,
  # and publishes behind protected environments.
  workflow_run:
    workflows: ["Release Tag Request"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'backblaze-labs/b2-mcp' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # This must exceed the ci-green wait below plus verify/build/pack/SBOM time.
    timeout-minutes: 60
    outputs:
      publish-tag: ${{ steps.request.outputs.tag }}
      checkout-sha: ${{ steps.ref.outputs.checkout_sha }}
      tarball-name: ${{ steps.pack.outputs.tarball_name }}
      tarball-sha256: ${{ steps.pack.outputs.tarball_sha256 }}
      tarball-integrity: ${{ steps.pack.outputs.tarball_integrity }}
      sbom-name: ${{ steps.sbom.outputs.sbom_name }}
      sbom-sha256: ${{ steps.sbom.outputs.sbom_sha256 }}
      checksums-name: ${{ steps.checksums.outputs.checksums_name }}
      checksums-sha256: ${{ steps.checksums.outputs.checksums_sha256 }}
      release-notes-name: ${{ steps.notes.outputs.release_notes_name }}
      release-notes-sha256: ${{ steps.notes.outputs.release_notes_sha256 }}
    steps:
      # actions/download-artifact v6, reviewed 2026-08-06.
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: release-tag-request
          path: release-request
          github-token: ${{ github.token }}
      - name: Read requested release tag
        id: request
        run: |
          set -euo pipefail
          PUBLISH_TAG="$(tr -d '\r\n' < release-request/tag.txt)"
          PUBLISH_TAG="${PUBLISH_TAG#refs/tags/}"
          if [[ ! "${PUBLISH_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag request artifact contains an invalid tag: ${PUBLISH_TAG}"
            exit 1
          fi
          echo "tag=${PUBLISH_TAG}" >> "${GITHUB_OUTPUT}"
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: refs/heads/ci-green
          persist-credentials: false
      # pnpm/action-setup v6.0.10, reviewed 2026-08-06.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Resolve ci-green protected release ref
        id: ref
        env:
          PUBLISH_TAG: ${{ steps.request.outputs.tag }}
          PUBLISH_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
          GH_TOKEN: ${{ github.token }}
        run: |
          # Private repo: authenticate the resolver's manual git remote reads
          # (ls-remote/fetch) via scoped GIT_CONFIG_* env so no git config leaks
          # into the next checkout (a leaked auth header returns HTTP 400).
          PUBLISH_TAG="${PUBLISH_TAG#refs/tags/}"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')" \
          node scripts/resolve-publish-ref.mjs \
            --tag "${PUBLISH_TAG}" \
            --remote "${PUBLISH_REMOTE}" \
            --wait-for-ci-green-timeout-ms 1200000 \
            --wait-for-ci-green-interval-ms 30000
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.ref.outputs.checkout_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release version and changelog
        env:
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_RUNTIME_URL: ""
          PUBLISH_TAG: ${{ steps.request.outputs.tag }}
        run: |
          PUBLISH_TAG="${PUBLISH_TAG#refs/tags/}"
          node scripts/verify-release-input.mjs --tag "${PUBLISH_TAG}"
      - name: Fetch protected refs for denylist scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Private repo: authenticate this manual fetch without persisting creds.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          for attempt in 1 2 3; do
            if git fetch --prune --no-tags origin '+refs/heads/main:refs/remotes/origin/main'; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "::error::Could not fetch protected refs for denylist scan"
              exit 1
            fi
            sleep "$attempt"
          done
      - run: pnpm install --frozen-lockfile
        env:
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_RUNTIME_URL: ""
      - run: pnpm run verify
        env:
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_RUNTIME_URL: ""
      - run: pnpm run typecheck
        env:
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_RUNTIME_URL: ""
      - run: pnpm run build
        env:
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_RUNTIME_URL: ""
      - name: Stamp release channel
        env:
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_RUNTIME_URL: ""
          PUBLISH_TAG: ${{ steps.request.outputs.tag }}
        run: |
          set -euo pipefail
          PUBLISH_TAG="${PUBLISH_TAG#refs/tags/}"
          pnpm run release:stamp -- --version "${PUBLISH_TAG#v}"
      - run: pnpm run check:package-budget
        env:
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_RUNTIME_URL: ""
      - run: pnpm run audit:supply-chain:denylist --ref HEAD --ref origin/main --packlist --expect-pack-file dist/index.js
        env:
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_RUNTIME_URL: ""
      - run: pnpm run audit:supply-chain
        env:
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_RUNTIME_URL: ""
          B2_MCP_AUDIT_EXPIRED_EXCEPTION_MODE: fail
      - name: Run production audit and generate release SBOM
        id: sbom
        env:
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_RUNTIME_URL: ""
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/publish-package"
          pnpm run release:sbom
          sbom_sha256="$(sha256sum "${GITHUB_WORKSPACE}/publish-package/b2-mcp-production.cdx.json" | awk '{print $1}')"
          echo "sbom_name=b2-mcp-production.cdx.json" >> "$GITHUB_OUTPUT"
          echo "sbom_sha256=${sbom_sha256}" >> "$GITHUB_OUTPUT"
      - name: Extract release notes
        id: notes
        env:
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_RUNTIME_URL: ""
          PUBLISH_TAG: ${{ steps.request.outputs.tag }}
        run: |
          set -euo pipefail
          PUBLISH_TAG="${PUBLISH_TAG#refs/tags/}"
          mkdir -p publish-package
          version="${PUBLISH_TAG#v}"
          node scripts/extract-release-notes.mjs \
            --version "${version}" \
            --output publish-package/release-notes.md
          notes_sha256="$(sha256sum publish-package/release-notes.md | awk '{print $1}')"
          echo "release_notes_name=release-notes.md" >> "$GITHUB_OUTPUT"
          echo "release_notes_sha256=${notes_sha256}" >> "$GITHUB_OUTPUT"
      - name: Build and scan publish tarball
        id: pack
        env:
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_RUNTIME_URL: ""
        run: |
          set -euo pipefail
          mkdir -p publish-package
          pack_json="$(npm pack --json --ignore-scripts --pack-destination publish-package)"
          printf '%s\n' "$pack_json" > publish-package/npm-pack.json
          tarball="$(find publish-package -maxdepth 1 -type f -name '*.tgz' | sort | head -n 1)"
          if [[ -z "$tarball" ]]; then
            echo "::error::npm pack did not produce a tarball"
            exit 1
          fi
          pnpm run audit:supply-chain:denylist \
            --ref HEAD \
            --ref origin/main \
            --tarball "$tarball"
          echo "tarball_name=$(basename "$tarball")" >> "$GITHUB_OUTPUT"
          echo "tarball_sha256=$(sha256sum "$tarball" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "tarball_integrity=$(node -e 'const fs = require("fs"); const [pack] = JSON.parse(fs.readFileSync("publish-package/npm-pack.json", "utf8")); process.stdout.write(pack.integrity || "");')" >> "$GITHUB_OUTPUT"
      - name: Dry-run npm publish from staged package directory
        env:
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_RUNTIME_URL: ""
          EXPECTED_TARBALL_NAME: ${{ steps.pack.outputs.tarball_name }}
        run: |
          set -euo pipefail
          tarball="./publish-package/${EXPECTED_TARBALL_NAME}"
          stage_dir="publish-package/dry-run-stage"
          rm -rf "$stage_dir"
          mkdir -p "$stage_dir"
          tar -xzf "$tarball" -C "$stage_dir"
          package_dir="${stage_dir}/package"
          if [[ ! -f "${package_dir}/package.json" ]]; then
            echo "::error::Expected staged package.json is missing"
            exit 1
          fi
          npm_tag="$(node scripts/npm-publish-metadata.mjs \
            --package-json "${package_dir}/package.json" \
            --field tag)"
          npm publish "$package_dir" \
            --dry-run \
            --access public \
            --ignore-scripts \
            --tag "${npm_tag}"
      - name: Write artifact checksums
        id: checksums
        env:
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_RUNTIME_URL: ""
        run: |
          set -euo pipefail
          cd publish-package
          sha256sum *.tgz *.cdx.json release-notes.md npm-pack.json > SHA256SUMS
          checksums_sha256="$(sha256sum SHA256SUMS | awk '{print $1}')"
          echo "checksums_name=SHA256SUMS" >> "$GITHUB_OUTPUT"
          echo "checksums_sha256=${checksums_sha256}" >> "$GITHUB_OUTPUT"
      - name: Stage publish helper scripts
        env:
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_RUNTIME_URL: ""
        run: |
          set -euo pipefail
          mkdir -p publish-package/release-tools/lib
          cp \
            scripts/npm-publish-metadata.mjs \
            scripts/verify-npm-registry-metadata.mjs \
            publish-package/release-tools/
          cp scripts/lib/release-utils.mjs publish-package/release-tools/lib/
      # actions/upload-artifact v6, reviewed 2026-08-06.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: npm-package
          path: |
            publish-package/*.tgz
            publish-package/*.cdx.json
            publish-package/SHA256SUMS
            publish-package/release-notes.md
            publish-package/npm-pack.json
            publish-package/release-tools/*.mjs
            publish-package/release-tools/lib/*.mjs
          if-no-files-found: error
          retention-days: 7

  live-contract:
    name: live contract before publish
    needs: prepare
    if: github.repository == 'backblaze-labs/b2-mcp'
    uses: ./.github/workflows/contract.yml
    with:
      checkout-sha: ${{ needs.prepare.outputs.checkout-sha }}
    secrets:
      LIVE_B2_KEY_ID: ${{ secrets.LIVE_B2_KEY_ID }}
      LIVE_B2_KEY: ${{ secrets.LIVE_B2_KEY }}
      LIVE_B2_MASTER_KEY_ID: ${{ secrets.LIVE_B2_MASTER_KEY_ID }}
      LIVE_B2_MASTER_KEY: ${{ secrets.LIVE_B2_MASTER_KEY }}

  publish:
    needs: [prepare, live-contract]
    if: github.repository == 'backblaze-labs/b2-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      # actions/download-artifact v6, reviewed 2026-08-06.
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: npm-package
          path: publish-package
      # Node 24.19.0 bundles npm >=11.5.1, required for npm trusted publishing.
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Preflight trusted publishing
        run: |
          set -euo pipefail
          if [[ -n "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::This workflow uses npm trusted publishing, not NODE_AUTH_TOKEN"
            exit 1
          fi
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "::error::GitHub OIDC id-token is unavailable; configure the npm-publish environment and id-token permission"
            exit 1
          fi
          curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            > /dev/null
      - name: Verify publish tarball
        env:
          EXPECTED_TARBALL_NAME: ${{ needs.prepare.outputs.tarball-name }}
          EXPECTED_TARBALL_SHA256: ${{ needs.prepare.outputs.tarball-sha256 }}
          EXPECTED_TARBALL_INTEGRITY: ${{ needs.prepare.outputs.tarball-integrity }}
        run: |
          set -euo pipefail
          tarball="./publish-package/${EXPECTED_TARBALL_NAME}"
          if [[ ! -f "$tarball" ]]; then
            echo "::error::Expected publish tarball ${tarball} is missing"
            exit 1
          fi
          actual_sha="$(sha256sum "$tarball" | awk '{print $1}')"
          if [[ "$actual_sha" != "$EXPECTED_TARBALL_SHA256" ]]; then
            echo "::error::Publish tarball SHA-256 mismatch"
            echo "expected=${EXPECTED_TARBALL_SHA256}"
            echo "actual=${actual_sha}"
            exit 1
          fi
          local_integrity="$(node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const file = process.argv[1];
            const digest = crypto.createHash("sha512").update(fs.readFileSync(file)).digest("base64");
            process.stdout.write(`sha512-${digest}`);
          ' "$tarball")"
          if [[ "$local_integrity" != "$EXPECTED_TARBALL_INTEGRITY" ]]; then
            echo "::error::Publish tarball npm integrity mismatch"
            echo "expected=${EXPECTED_TARBALL_INTEGRITY}"
            echo "actual=${local_integrity}"
            exit 1
          fi
          rm -rf publish-package/staged
          mkdir -p publish-package/staged
          tar -xzf "$tarball" -C publish-package/staged
          if [[ ! -f publish-package/staged/package/package.json ]]; then
            echo "::error::Expected staged package.json is missing"
            exit 1
          fi
      - name: Publish staged package directory with trusted provenance
        env:
          EXPECTED_TARBALL_SHA256: ${{ needs.prepare.outputs.tarball-sha256 }}
          EXPECTED_TARBALL_INTEGRITY: ${{ needs.prepare.outputs.tarball-integrity }}
        run: |
          set -euo pipefail
          package_dir="./publish-package/staged/package"
          if [[ ! -f "${package_dir}/package.json" ]]; then
            echo "::error::Expected staged package.json is missing"
            exit 1
          fi
          package_metadata="$(node publish-package/release-tools/npm-publish-metadata.mjs \
            --package-json "${package_dir}/package.json")"
          package_spec="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).spec)' "$package_metadata")"
          npm_tag="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).tag)' "$package_metadata")"
          metadata_verify_args=(
            --package "$package_spec"
            --timeout-ms 120000
            --initial-interval-ms 5000
            --max-interval-ms 30000
          )
          legacy_metadata_args=(
            --allow-legacy-local-path-metadata "@backblaze-labs/b2-mcp@0.1.0"
            --allow-legacy-local-path-metadata "@backblaze-labs/b2-mcp@0.1.1"
          )
          if registry_integrity="$(npm view "${package_spec}" dist.integrity --json 2>/tmp/npm-view-error)"; then
            registry_integrity="$(node -e 'const value = JSON.parse(process.argv[1] || "null"); process.stdout.write(value || "");' "$registry_integrity")"
            if [[ "$registry_integrity" == "$EXPECTED_TARBALL_INTEGRITY" ]]; then
              node publish-package/release-tools/verify-npm-registry-metadata.mjs \
                "${metadata_verify_args[@]}" \
                "${legacy_metadata_args[@]}"
              echo "::notice::${package_spec} already exists on npm with matching integrity; treating as idempotent success"
              exit 0
            fi
            echo "::error::${package_spec} already exists on npm with different integrity"
            echo "expected=${EXPECTED_TARBALL_INTEGRITY}"
            echo "registry=${registry_integrity}"
            exit 1
          fi
          if ! grep -Eq '(E404|404|not found)' /tmp/npm-view-error; then
            cat /tmp/npm-view-error
            exit 1
          fi
          rm -rf publish-package/repacked
          mkdir -p publish-package/repacked
          repack_json="$(npm pack "$package_dir" --json --ignore-scripts --pack-destination publish-package/repacked)"
          printf '%s\n' "$repack_json" > publish-package/repacked/npm-pack.json
          repacked_tarball="$(find publish-package/repacked -maxdepth 1 -type f -name '*.tgz' | sort | head -n 1)"
          if [[ -z "$repacked_tarball" ]]; then
            echo "::error::npm pack did not produce a staged tarball"
            exit 1
          fi
          repacked_sha256="$(sha256sum "$repacked_tarball" | awk '{print $1}')"
          if [[ "$repacked_sha256" != "$EXPECTED_TARBALL_SHA256" ]]; then
            echo "::error::Staged package tarball SHA-256 mismatch"
            echo "expected=${EXPECTED_TARBALL_SHA256}"
            echo "actual=${repacked_sha256}"
            exit 1
          fi
          repacked_integrity="$(node -e 'const [pack] = JSON.parse(process.argv[1]); process.stdout.write(pack.integrity || "");' "$repack_json")"
          if [[ "$repacked_integrity" != "$EXPECTED_TARBALL_INTEGRITY" ]]; then
            echo "::error::Staged package tarball npm integrity mismatch"
            echo "expected=${EXPECTED_TARBALL_INTEGRITY}"
            echo "actual=${repacked_integrity}"
            exit 1
          fi
          # Publish from the staged directory; npm records local file coordinates
          # in registry metadata when the publish target is a .tgz path.
          npm publish "$package_dir" \
            --provenance \
            --access public \
            --ignore-scripts \
            --tag "$npm_tag"
          node publish-package/release-tools/verify-npm-registry-metadata.mjs \
            "${metadata_verify_args[@]}"

  container-image:
    needs: [prepare, publish]
    if: github.repository == 'backblaze-labs/b2-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      # Check out the protected `ci-green` ref (a trusted constant, like the
      # prepare job) rather than a dynamic sha in this write-privileged job, then
      # hard-pin to the validated release commit below. This keeps the checkout
      # off attacker-influenced refs in a packages:write/id-token:write context.
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: refs/heads/ci-green
          fetch-depth: 0
          persist-credentials: false
      - name: Pin to the validated release commit
        env:
          CHECKOUT_SHA: ${{ needs.prepare.outputs.checkout-sha }}
        run: |
          set -euo pipefail
          # `ci-green` is the protected ref prepare already validated the tag
          # against; fail closed if the validated release sha is not contained in
          # it, then detach to that exact commit so the image is built from the
          # reproducible release source.
          if ! git merge-base --is-ancestor "${CHECKOUT_SHA}" HEAD; then
            echo "::error::${CHECKOUT_SHA} is not contained in protected ci-green"
            exit 1
          fi
          git checkout --detach "${CHECKOUT_SHA}"
      # docker/setup-qemu-action v3.6.0, reviewed 2026-08-07.
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392
      # docker/setup-buildx-action v3.11.1, reviewed 2026-08-07.
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      # sigstore/cosign-installer v3.9.2, reviewed 2026-08-07.
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159
      - name: Smoke local Docker image
        env:
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_RUNTIME_URL: ""
          CHECKOUT_SHA: ${{ needs.prepare.outputs.checkout-sha }}
          PUBLISH_TAG: ${{ needs.prepare.outputs.publish-tag }}
        run: |
          set -euo pipefail
          # Stable releases stamp and assert the published runtime channel;
          # prereleases stay on the dev channel and skip the release-version arg.
          version="${PUBLISH_TAG#refs/tags/}"
          version="${version#v}"
          args=(--build --image "b2-mcp-release-smoke:${CHECKOUT_SHA}")
          if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            args+=(--release-version "${version}")
          fi
          node scripts/smoke-container-image.mjs "${args[@]}"
      - name: Publish signed multi-platform GHCR image
        id: image
        env:
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          ACTIONS_RUNTIME_URL: ""
          CHECKOUT_SHA: ${{ needs.prepare.outputs.checkout-sha }}
          GHCR_TOKEN: ${{ github.token }}
          PUBLISH_TAG: ${{ needs.prepare.outputs.publish-tag }}
          REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
        run: |
          export PUBLISH_TAG="${PUBLISH_TAG#refs/tags/}"
          node scripts/publish-container-image.mjs

  github-release:
    needs: [prepare, publish, container-image]
    if: github.repository == 'backblaze-labs/b2-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      # actions/download-artifact v6, reviewed 2026-08-06.
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: npm-package
          path: publish-package
      - name: Verify release SBOM
        env:
          EXPECTED_SBOM_NAME: ${{ needs.prepare.outputs.sbom-name }}
          EXPECTED_SBOM_SHA256: ${{ needs.prepare.outputs.sbom-sha256 }}
          EXPECTED_TARBALL_NAME: ${{ needs.prepare.outputs.tarball-name }}
          EXPECTED_TARBALL_SHA256: ${{ needs.prepare.outputs.tarball-sha256 }}
          EXPECTED_CHECKSUMS_NAME: ${{ needs.prepare.outputs.checksums-name }}
          EXPECTED_CHECKSUMS_SHA256: ${{ needs.prepare.outputs.checksums-sha256 }}
          EXPECTED_RELEASE_NOTES_NAME: ${{ needs.prepare.outputs.release-notes-name }}
          EXPECTED_RELEASE_NOTES_SHA256: ${{ needs.prepare.outputs.release-notes-sha256 }}
        run: |
          set -euo pipefail
          tarball="./publish-package/${EXPECTED_TARBALL_NAME}"
          sbom="publish-package/${EXPECTED_SBOM_NAME}"
          checksums="publish-package/${EXPECTED_CHECKSUMS_NAME}"
          notes="publish-package/${EXPECTED_RELEASE_NOTES_NAME}"
          if [[ ! -f "$tarball" ]]; then
            echo "::error::Expected release tarball ${tarball} is missing"
            exit 1
          fi
          if [[ ! -f "$sbom" ]]; then
            echo "::error::Expected release SBOM ${sbom} is missing"
            exit 1
          fi
          if [[ ! -f "$checksums" ]]; then
            echo "::error::Expected release checksums ${checksums} are missing"
            exit 1
          fi
          if [[ ! -f "$notes" ]]; then
            echo "::error::Expected release notes ${notes} are missing"
            exit 1
          fi
          actual_tarball_sha="$(sha256sum "$tarball" | awk '{print $1}')"
          if [[ "$actual_tarball_sha" != "$EXPECTED_TARBALL_SHA256" ]]; then
            echo "::error::Release tarball SHA-256 mismatch"
            exit 1
          fi
          actual_sbom_sha="$(sha256sum "$sbom" | awk '{print $1}')"
          if [[ "$actual_sbom_sha" != "$EXPECTED_SBOM_SHA256" ]]; then
            echo "::error::Release SBOM SHA-256 mismatch"
            echo "expected=${EXPECTED_SBOM_SHA256}"
            echo "actual=${actual_sbom_sha}"
            exit 1
          fi
          actual_checksums_sha="$(sha256sum "$checksums" | awk '{print $1}')"
          if [[ "$actual_checksums_sha" != "$EXPECTED_CHECKSUMS_SHA256" ]]; then
            echo "::error::Release checksums SHA-256 mismatch"
            exit 1
          fi
          actual_notes_sha="$(sha256sum "$notes" | awk '{print $1}')"
          if [[ "$actual_notes_sha" != "$EXPECTED_RELEASE_NOTES_SHA256" ]]; then
            echo "::error::Release notes SHA-256 mismatch"
            exit 1
          fi
          (cd publish-package && sha256sum --check "${EXPECTED_CHECKSUMS_NAME}")
      - name: Create GitHub release from verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TARBALL_NAME: ${{ needs.prepare.outputs.tarball-name }}
          EXPECTED_SBOM_NAME: ${{ needs.prepare.outputs.sbom-name }}
          EXPECTED_CHECKSUMS_NAME: ${{ needs.prepare.outputs.checksums-name }}
          EXPECTED_RELEASE_NOTES_NAME: ${{ needs.prepare.outputs.release-notes-name }}
          PUBLISH_TAG: ${{ needs.prepare.outputs.publish-tag }}
        run: |
          set -euo pipefail
          PUBLISH_TAG="${PUBLISH_TAG#refs/tags/}"
          release_flags=(
            --repo "${GITHUB_REPOSITORY}"
            --notes-file "publish-package/${EXPECTED_RELEASE_NOTES_NAME}"
            --verify-tag
          )
          create_flags=(
            --repo "${GITHUB_REPOSITORY}"
            --title "${PUBLISH_TAG}"
            --notes-file "publish-package/${EXPECTED_RELEASE_NOTES_NAME}"
            --verify-tag
          )
          if [[ "${PUBLISH_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            release_flags+=(--prerelease)
            create_flags+=(--prerelease --latest=false)
          fi
          if gh release view "${PUBLISH_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${PUBLISH_TAG}" "${release_flags[@]}"
          else
            gh release create "${PUBLISH_TAG}" "${create_flags[@]}"
          fi
          gh release upload "${PUBLISH_TAG}" \
            "publish-package/${EXPECTED_TARBALL_NAME}" \
            "publish-package/${EXPECTED_SBOM_NAME}" \
            "publish-package/${EXPECTED_RELEASE_NOTES_NAME}" \
            "publish-package/npm-pack.json" \
            "publish-package/${EXPECTED_CHECKSUMS_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
