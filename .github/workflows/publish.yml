name: Publish Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: vMAJOR.MINOR.PATCH[-prerelease] tag; must be reachable from ci-green
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'backblaze-labs/b2-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      checkout-sha: ${{ steps.ref.outputs.checkout_sha }}
      tarball-name: ${{ steps.pack.outputs.tarball_name }}
      tarball-sha256: ${{ steps.pack.outputs.tarball_sha256 }}
    steps:
      # actions/checkout v6, reviewed 2026-08-05.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # actions/setup-node v7, reviewed 2026-08-05.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Resolve protected release ref
        id: ref
        env:
          PUBLISH_TAG: ${{ inputs.tag }}
          PUBLISH_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          node scripts/resolve-publish-ref.mjs \
            --tag "${PUBLISH_TAG}" \
            --remote "${PUBLISH_REMOTE}"
      # actions/checkout v6, reviewed 2026-08-05.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.ref.outputs.checkout_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch protected refs for denylist scan
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if git fetch --prune --no-tags origin '+refs/heads/main:refs/remotes/origin/main'; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "::error::Could not fetch protected refs for denylist scan"
              exit 1
            fi
            sleep "$attempt"
          done
      - run: npm ci --engine-strict
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:package-budget
      - run: npm run audit:supply-chain:denylist -- --ref HEAD --ref origin/main --packlist --expect-pack-file dist/index.js
      - run: npm run audit:supply-chain
        env:
          B2_MCP_AUDIT_EXPIRED_EXCEPTION_MODE: fail
      - name: Build and scan publish tarball
        id: pack
        run: |
          set -euo pipefail
          mkdir -p publish-package
          npm pack --ignore-scripts --pack-destination publish-package
          tarball="$(find publish-package -maxdepth 1 -type f -name '*.tgz' | sort | head -n 1)"
          if [[ -z "$tarball" ]]; then
            echo "::error::npm pack did not produce a tarball"
            exit 1
          fi
          npm run audit:supply-chain:denylist -- \
            --ref HEAD \
            --ref origin/main \
            --tarball "$tarball"
          echo "tarball_name=$(basename "$tarball")" >> "$GITHUB_OUTPUT"
          echo "tarball_sha256=$(sha256sum "$tarball" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      # actions/upload-artifact v6, reviewed 2026-08-05.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: npm-package
          path: publish-package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    if: github.repository == 'backblaze-labs/b2-mcp'
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      # actions/download-artifact v6, reviewed 2026-08-05.
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: npm-package
          path: publish-package
      # actions/setup-node v7, reviewed 2026-08-05.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          registry-url: https://registry.npmjs.org
      - name: Preflight trusted publishing
        run: |
          set -euo pipefail
          if [[ -n "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::This workflow uses npm trusted publishing, not NODE_AUTH_TOKEN"
            exit 1
          fi
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "::error::GitHub OIDC id-token is unavailable; configure the npm-publish environment and id-token permission"
            exit 1
          fi
          curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            > /dev/null
      - name: Verify publish tarball
        env:
          EXPECTED_TARBALL_NAME: ${{ needs.prepare.outputs.tarball-name }}
          EXPECTED_TARBALL_SHA256: ${{ needs.prepare.outputs.tarball-sha256 }}
        run: |
          set -euo pipefail
          tarball="publish-package/${EXPECTED_TARBALL_NAME}"
          if [[ ! -f "$tarball" ]]; then
            echo "::error::Expected publish tarball ${tarball} is missing"
            exit 1
          fi
          actual_sha="$(sha256sum "$tarball" | awk '{print $1}')"
          if [[ "$actual_sha" != "$EXPECTED_TARBALL_SHA256" ]]; then
            echo "::error::Publish tarball SHA-256 mismatch"
            echo "expected=${EXPECTED_TARBALL_SHA256}"
            echo "actual=${actual_sha}"
            exit 1
          fi
      - name: Publish prebuilt tarball with trusted provenance
        env:
          EXPECTED_TARBALL_NAME: ${{ needs.prepare.outputs.tarball-name }}
        run: npm publish "publish-package/${EXPECTED_TARBALL_NAME}" --provenance --access public --ignore-scripts
