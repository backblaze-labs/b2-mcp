# Advanced CodeQL setup (replaces GitHub default setup so the analysis can be
# gated). Dependabot pull requests are skipped entirely: no code scanning runs
# on dependency-bump PRs, matching the CI and Quality Keeper gates.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "24 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL analyze
    # Skip Dependabot PRs: no code scanning on dependency bumps. Uses the PR
    # author (not github.actor) so it holds even when a human pushes to the
    # dependabot branch.
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Least privilege for CodeQL: read the run graph + code, write findings.
    permissions:
      actions: read # CodeQL reads the Actions run graph during analysis.
      contents: read # Checkout of the repository under analysis.
      security-events: write # Upload CodeQL SARIF to the code scanning tab.
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      # actions/checkout v7, reviewed 2026-08-25.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # github/codeql-action/init v4.38.2, reviewed 2026-10-06.
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      # github/codeql-action/analyze v4.38.2, reviewed 2026-10-06.
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
