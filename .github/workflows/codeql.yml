# Advanced CodeQL setup (replaces GitHub default setup so the analysis can be
# gated). Dependabot pull requests are skipped entirely: no code scanning runs
# on dependency-bump PRs, matching the CI and Quality Keeper gates.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "24 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL analyze
    # Skip Dependabot PRs: no code scanning on dependency bumps. Uses the PR
    # author (not github.actor) so it holds even when a human pushes to the
    # dependabot branch.
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      # actions/checkout v6, reviewed 2026-08-06.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # github/codeql-action/init v4.37.6, reviewed 2026-08-06.
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      # github/codeql-action/analyze v4.37.6, reviewed 2026-08-06.
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          category: "/language:${{ matrix.language }}"
