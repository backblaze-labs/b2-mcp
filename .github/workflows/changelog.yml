name: Changelog

# Requires a changie fragment for user-visible changes (scripts/check-changelog.mjs).
# Label a PR `skip-changelog` to opt out. Dependabot PRs never run CI.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions: {}

concurrency:
  group: changelog-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    name: changelog
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Reads the base branch to find the fragments this PR adds.
    steps:
      # actions/checkout v7, reviewed 2026-08-25.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0 # The base branch is needed to find the fragments this PR adds.
      # pnpm/action-setup v6.1.0, reviewed 2026-09-13.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run changelog:check
        env:
          BASE_REF: origin/${{ github.base_ref }}
