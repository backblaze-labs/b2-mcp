name: Control Bands

# Closes the loop on CI health (intent/README.md, ops/control-bands/README.md).
# Detection is deterministic: daily failure rates of `CI` on pushes to main go
# through ops/control-bands/detect.mjs. A 2σ or 3σ breach opens (or updates) a
# draft intent issue for the owners to triage; the agent never fixes anything
# from here. Optional read-only diagnosis needs ANTHROPIC_API_KEY in llm-evals.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * *"

permissions: {}

concurrency:
  group: control-bands-${{ github.repository }}
  cancel-in-progress: false

jobs:
  detect:
    if: github.repository == 'backblaze-labs/b2-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # Reads CI run conclusions.
      contents: read # Checks out the detector.
      issues: write # Opens or comments on the draft intent issue.
    outputs:
      tier: ${{ steps.detect.outputs.tier }}
      issue: ${{ steps.issue.outputs.number }}
    steps:
      # actions/checkout v7, reviewed 2026-08-25.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - name: Classify the newest reading
        id: detect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node ops/control-bands/readings.mjs > "${RUNNER_TEMP}/readings.json"
          if ! node ops/control-bands/detect.mjs < "${RUNNER_TEMP}/readings.json" > "${RUNNER_TEMP}/breach.json" 2> "${RUNNER_TEMP}/detect.err"; then
            if grep -q "need at least" "${RUNNER_TEMP}/detect.err"; then
              echo "::notice::$(cat "${RUNNER_TEMP}/detect.err"); not enough CI history on main yet."
              echo '{"tier":"insufficient"}' > "${RUNNER_TEMP}/breach.json"
            else
              cat "${RUNNER_TEMP}/detect.err" >&2
              exit 1
            fi
          fi
          cat "${RUNNER_TEMP}/breach.json"
          echo "tier=$(jq -r .tier "${RUNNER_TEMP}/breach.json")" >> "$GITHUB_OUTPUT"
          {
            echo "### CI failure rate on main"
            echo
            echo '```json'
            cat "${RUNNER_TEMP}/breach.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the draft intent issue
        id: issue
        if: steps.detect.outputs.tier == '2sigma' || steps.detect.outputs.tier == '3sigma'
        env:
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ steps.detect.outputs.tier }}
        run: |
          set -euo pipefail
          title="Intent: CI failure rate breach on main"
          body="$(node -e '
            const b = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            console.log([
              "# Intent: CI failure rate breach on main",
              "",
              `Author: monitoring agent (ci_failure_rate_main, ${b.tier}). Status: draft.`,
              "",
              "## Problem",
              "",
              `Daily failure rate of CI on pushes to main is ${b.reading} against a mean of ${b.mean} (sigma ${b.sigma}); rule: ${b.rule}.`,
              `Runs: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/workflows/test.yml?query=branch%3Amain`,
              "",
              "## Proposed outcome",
              "",
              "CI on main is back at its baseline failure rate.",
              "",
              "## Affected users and systems",
              "",
              "Contributors and agents whose PRs rebase onto main; releases gated on ci-green.",
              "",
              "## Constraints",
              "",
              "Fix through a PR; do not loosen or skip tests to recover the rate.",
              "",
              "## Action already taken",
              "",
              "None. Detection only.",
              "",
              "## Open questions",
              "",
              "Which change in the window caused this, and is it flaky or real?",
            ].join("\n"));
          ' "${RUNNER_TEMP}/breach.json")"
          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
            echo "number=${existing}" >> "$GITHUB_OUTPUT"
          else
            url="$(gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "${body}")"
            echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
          fi
          echo "::warning::CI failure rate ${TIER} breach; draft intent issue ${url:-#${existing}}"

  diagnose:
    name: read-only diagnosis
    needs: detect
    if: needs.detect.outputs.issue != ''
    runs-on: ubuntu-latest
    environment: llm-evals
    timeout-minutes: 20
    permissions:
      actions: read # gh run view / list for the failing runs.
      contents: read # Reads the repository at main.
      issues: write # Posts the diagnosis on the draft intent issue.
    steps:
      - name: Require an API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [[ -z "${ANTHROPIC_API_KEY:-}" ]]; then
            echo "::notice::ANTHROPIC_API_KEY is not configured in llm-evals; skipping diagnosis."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      # actions/checkout v7, reviewed 2026-08-25.
      - if: steps.key.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # pnpm/action-setup v6.1.0, reviewed 2026-09-13.
      - if: steps.key.outputs.enabled == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      # actions/setup-node v7, reviewed 2026-08-06.
      - if: steps.key.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - name: Diagnose and comment
        if: steps.key.outputs.enabled == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.detect.outputs.issue }}
        run: |
          set -euo pipefail
          pnpm --dir tools/agent-cli install --frozen-lockfile --ignore-scripts
          node tools/agent-cli/node_modules/@anthropic-ai/claude-code/cli-wrapper.cjs -p "Read issue ${ISSUE} in ${GITHUB_REPOSITORY} with gh issue view. Diagnose the CI failure-rate breach on main from the recent failed runs (gh run list --workflow test.yml --branch main, gh run view --log-failed). Cite run IDs, commit SHAs and log lines as evidence; say whether each failure looks flaky or real. Do not speculate about root cause as fact. Output Markdown for the issue's Problem and Open questions sections only." \
            --allowedTools "Read,Grep,Glob,Bash(gh issue view *),Bash(gh run view *),Bash(gh run list *)" \
            --permission-mode dontAsk > "${RUNNER_TEMP}/diagnosis.md"
          gh issue comment "${ISSUE}" --repo "${GITHUB_REPOSITORY}" --body-file "${RUNNER_TEMP}/diagnosis.md"
