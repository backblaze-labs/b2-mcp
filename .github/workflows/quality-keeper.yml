# Quality Keeper private-repository caller (backblaze-labs/quality-keeper#312).
#
# This repository keeps its existing test, contract, smoke, and publish
# workflows as the authoritative product gates; Quality Keeper is advisory and
# must not block required CI.
#
# Trust boundary:
# - This pull_request workflow is analysis-only and passes no repository secrets.
# - It does not call the private reusable workflow because that workflow's report
#   job requires PR write permission and an app private key.
# - A future trusted workflow_run reporter must consume inert artifacts and never
#   check out or run PR head code before minting any reporting credential.

name: Quality Keeper

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# No pull_request_target: fork, draft, and unknown-head code is never trusted.
permissions: {}

jobs:
  quality-keeper:
    if: >-
      ${{
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false
      }}
    name: Quality Keeper advisory guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Keep PR Quality Keeper unprivileged
        shell: bash
        run: |
          echo "Quality Keeper reporting is disabled on pull_request."
          echo "A trusted workflow_run reporter must consume inert artifacts only."
