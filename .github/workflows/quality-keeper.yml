# Quality Keeper private-repository caller (backblaze-labs/quality-keeper#312).
#
# This repository keeps its existing test, contract, smoke, and publish
# workflows as the authoritative product gates; Quality Keeper is advisory and
# must not block required CI.
#
# QK #402: the pinned private workflow owns the two-job trust boundary.
# Its execute job has contents:read and no App key. A separate report job
# consumes inert artifacts and is the only job that receives the App key.

name: Quality Keeper

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# No pull_request_target: fork, draft, and unknown-head code is never trusted.
permissions: {}

jobs:
  quality-keeper:
    if: >-
      ${{
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false
      }}
    uses: backblaze-labs/quality-keeper/.github/workflows/quality-keeper-private-reusable.yml@18428a5576c827e730aae4fa3ea63b7597978973
    with:
      advisory: true
      include_expensive: false
    permissions:
      contents: read
      pull-requests: write
      actions: read
    secrets:
      QK_APP_PRIVATE_KEY: ${{ secrets.QK_APP_PRIVATE_KEY }}
