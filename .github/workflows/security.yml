name: Workflow Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  zizmor:
    name: zizmor workflow scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v6, reviewed 2026-08-05.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # zizmor-action v0.6.2, reviewed 2026-08-05.
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054
        with:
          advanced-security: false
          annotations: true
          min-severity: medium
          min-confidence: medium
          version: 1.29.0
