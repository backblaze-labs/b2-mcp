name: Standalone B2 simulator
description: >-
  Check out the pinned backblaze-labs/b2-simulator revision with a read-only
  deploy key and export B2_SIMULATOR_DIR for the simulator-backed tests
  (docs/TESTING.md, "Standalone Simulator"). Pull requests from forks are
  refused, because GitHub does not give them the key.
inputs:
  deploy-key:
    description: The SIMULATOR_DEPLOY_KEY secret, a read-only deploy key of backblaze-labs/b2-simulator.
    required: true
  revision:
    description: Full commit of backblaze-labs/b2-simulator to test against. Change it only here.
    required: false
    default: f8e3cfc5e7f477835af3bf2a972f55cb0e8b0016
runs:
  using: composite
  steps:
    - name: Require a pull request branch in this repository
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      run: |
        if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
          echo "::error::Simulator-backed tests are required and need the SIMULATOR_DEPLOY_KEY secret, which GitHub does not give to pull requests from forks. Push this change to a branch in $GITHUB_REPOSITORY (a maintainer can do it for you) and open the pull request from there."
          exit 1
        fi
    - name: Require the simulator deploy key
      shell: bash
      env:
        DEPLOY_KEY: ${{ inputs.deploy-key }}
      run: |
        if [ -z "$DEPLOY_KEY" ]; then
          echo "::error::SIMULATOR_DEPLOY_KEY is not set. A repository admin must add it (a read-only deploy key of backblaze-labs/b2-simulator) as an Actions secret and, for Dependabot pull requests, also as a Dependabot secret."
          exit 1
        fi
    # actions/checkout v7, reviewed 2026-08-25.
    - name: Check out the pinned simulator
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: backblaze-labs/b2-simulator
        ref: ${{ inputs.revision }}
        ssh-key: ${{ inputs.deploy-key }}
        persist-credentials: false
        path: .b2-simulator
    # Moved out of the workspace so lint, format and spelling never scan it.
    - name: Verify the simulator revision and export B2_SIMULATOR_DIR
      shell: bash
      env:
        SIMULATOR_REVISION: ${{ inputs.revision }}
      run: |
        set -euo pipefail
        test "$(git -C .b2-simulator rev-parse HEAD)" = "$SIMULATOR_REVISION"
        test -z "$(git -C .b2-simulator status --short)"
        dest="$RUNNER_TEMP/b2-simulator"
        rm -rf "$dest"
        mv .b2-simulator "$dest"
        if command -v cygpath >/dev/null 2>&1; then dest="$(cygpath -w "$dest")"; fi
        echo "B2_SIMULATOR_DIR=$dest" >> "$GITHUB_ENV"
