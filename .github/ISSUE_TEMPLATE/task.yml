name: Task
description: Decided work with a clear definition of done (maintenance, refactor, docs, follow-up)
body:
  - type: markdown
    attributes:
      value: |
        Use this for work that is already decided. For a new idea use the feature request, and for something broken use the bug report. Do not include B2 application keys or any credential values.
  - type: checkboxes
    id: prechecks
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What needs to be done, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why now? Link the parent issue, intent, spec, incident or discussion it comes from.
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: Checks someone can run or observe, for example "pnpm run ci passes" or "docs/TESTING.md lists the new layer".
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in, and what is explicitly out.
  - type: textarea
    id: risks
    attributes:
      label: Risks and how to revert
      description: What could go wrong, and how to undo the change.
