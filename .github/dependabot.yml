version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
    open-pull-requests-limit: 5
    groups:
      # The SDK will handle durable B2 credentials after migration. Every bump
      # requires human parity, provenance, and engine-floor review.
      b2-sdk:
        patterns:
          - "@backblaze-labs/b2-sdk"
        update-types:
          - minor
          - patch
      # TOON dev/test decoder bumps can change contract-oracle behavior. Keep
      # them isolated from routine dependency drift.
      toon-format:
        patterns:
          - "@toon-format/toon"
        update-types:
          - minor
          - patch
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        # Keep development drift reviewable; majors stay as separate PRs.
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - github-actions
