version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The SDK will handle durable B2 credentials after migration. Every bump
      # requires human parity, provenance, and engine-floor review.
      b2-sdk:
        patterns:
          - "@backblaze-labs/b2-sdk"
      # TOON format bumps can change the LLM-facing text contract. Keep them
      # isolated from routine dependency drift.
      toon-format:
        patterns:
          - "@toon-format/toon"
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      dev-dependencies:
        dependency-type: development
        # Hold major bumps for manual review — TS 5→6, Jest 29→30 etc.
        # have broken the build before.
        update-types:
          - minor
          - patch
    labels:
      - dependencies
    ignore:
      # Majors held for manual runtime review. Phase 1 standardizes on
      # Node 22; opossum and @types/node major bumps may raise that floor.
      - dependency-name: opossum
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@toon-format/toon"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
