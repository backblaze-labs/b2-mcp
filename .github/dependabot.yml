version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      dev-dependencies:
        dependency-type: development
        # Hold major bumps for manual review — TS 5→6, Jest 29→30 etc.
        # have broken the build before.
        update-types:
          - minor
          - patch
    labels:
      - dependencies
    ignore:
      # Majors held until the repo raises its Node floor (engines >=18,
      # CI tests 20/22): opossum 10 drops Node 20; @types/node majors
      # ahead of the floor admit APIs that crash on supported runtimes.
      - dependency-name: opossum
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
